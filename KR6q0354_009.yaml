body:
  text: 偈頌門人護位等編讀華嚴華嚴法界浩無邊玉轉珠回滿目前究竟直須超性海精通猶是涴心田不離當處該三德曲説多方顯十玄慚愧舍那尊特父誑兒偏解奮空拳讀法華六萬餘言最上乘寒窗相對篆煙騰無邊譬喻刀頭蜜大事因緣火裏冰彈指不妨開寶塔焚身誰解繼真燈循行數墨三千部一句全超憶慧能讀楞嚴諦觀佛頂首楞嚴金口流珠顆顆圓大定不離修萬行密因先合斷三緣毫端現剎難思議眼處觀聲絶正偏赤手果能探教海得魚須信貴忘筌讀楞伽大品楞伽奧旨深止啼黃葉勝真金了知我相元無我直達心宗豈有心兔角龜毛難比況情波識浪任浮沈百非四句俱拈却蠓蠛蚍蜉解賞音讀圓覺大圓覺海廣尤深誰信真源近可尋三觀澄明標匪月六塵清淨礦元金却憐調御多饒舌未許曼殊獨賞音披卷只圖遮老眼剋期修證本無心血書華嚴經五十三人血戰來百城煙水盡成衃毗盧樓閣紅雲湧帝網山河赤幟開十指頭邊師子吼一針鋒上象王回有無功力難思識直得腥風遍九垓墨書法華松陵信士王元吉夫婦同持妙法華笑倒虗空多寶塔驚翻露地白牛車世緣未了曾何礙寶所親登定不差朵朵青蓮毫末現腕頭餘力更堪誇繡字金剛般若經般若靈文宿有緣等間繡出喜功圓銀鉤鐵畫分行布玉線金針顯妙玄兔子懷胎皆剩法蚌含明月匪真詮金剛正體堂堂露錦上添花五色鮮秦因二上人同書華嚴毫端幻出大華嚴名句形身勝妙兼寶網雲臺同演説塵毛法界盡包含衆生共入毗盧藏梵苑雙敷優鉢曇披卷了無文字相善財空走百城南藏主職滿還吳今古何曾有悟迷南屏懶把布毛吹山青雲白光明藏鵲噪鴉鳴小艷詩十里平湖秋淡淡三吳歸路黍離離莫嫌送別無分付又是重安眼上眉僧院判奉旨降香育王寶陀北歸次雪窗和尚韻以贈西河師子僧思吉遠降天香跨海回設利寶光開五色洛伽大士舞三臺孤峯頂上逢彌勒百草頭邊識善財聖主無為千萬壽南方佛法未全灰答訓書記兼柬師林立卓峯撒土猶能更撒沙難兄難弟喜通家咬人師子全牙爪逐塊韓盧曳尾巴月下守株空待兔棒頭打草要驚蛇頽綱力振看能事種豆何妨得稻麻寶藏主還吳江法王大寶祕形山覿面當機要見難紙襖鈔來渾是錯柴爿揚下太無端神駒墮地萬里志彩鳳衝霄五色翰少室宗綱方解紐未容高臥曲江干無言始終一字不曾談開口分明落二三少室九年成滲漏毗耶一默露廉纖禪詮諜諜瘡疣紙教網重重鶻臭衫截斷溪聲廣長舌春風飛燕自喃喃次韻答夢堂法兄兵戈南北競喧爭兄弟分違似隔生瀛海丹山君宴坐劫灰雙徑我徒行只添束篾腰間重依舊眉毛眼上橫賴有祖翁家活在不妨日午打三更示道同淨人大道何曾有異同才生分別便乖宗堂堂獨露聲塵外歷歷常居動用中明鏡非臺光自照菩提無樹體元空迢迢龍翔人歸遠千古誰能振祖風答普濟元恕法兄機鋒抹過睦州蹤幢蓋行看上五峯花偈寄來春尚早蘿窗披玩雪初融樓臺突兀吳江上瓦礫從衡徑塢中裁謝莫嫌成懶慢弟兄千里本同風妙藏主參方純圓獨妙子深諳杖屨何須事別參良遂無端見麻谷德山落賺到龍潭衝雲突日遼天鶻覂駕空羣汗血驂袖裏摩尼發光怪照開煙水百城南無竭一滴流來自劫空涓涓不絶遠朝宗延洪孰究根源力消長全超造化功沃日滔天殊未泯分枝列派有何窮叢林萬古均沾溉共喜曹溪正脈通次韻送日東俊侍者入閩三喚三呼若震驚屎腸抖擻為君傾國師機用親仍切侍者威儀老更成楖栗枝頭懸震旦蟭螟眼裏泛蓬瀛天風亭上聽秋雨滿耳須知不是聲答蘇昌齡編修病中索茶東土西乾老淨名經秋不見渴塵生每懷取飯香積國未暇問疾毗耶城劇談直欲離言説安眠豈有間心情趙州道個喫茶去瞎却幾多人眼睛次韻奉答張蛻軒承旨求作師祖善權和尚塔銘閣老文章有耿光任將四大作禪床筆頭慣點金剛眼手面宏開大寂場鯨海重勞詩遠寄龍淵深喜道相忘亭亭祖塔西岡上有待摛辭下帝鄉次南堂了菴和尚韻拂袖中吳第一峯南堂岌岌凜高風坐令鷲嶺真規復不翅松源正脈通長庚爛爛橫霄漢野鶴翩翩絶檻籠快活有時無著處風顛寒拾恰相同次韻示堅禪人芭蕉身相本非堅生死根深苦繞纏直下一刀成兩段何須問道與參禪砂鍋頓頓虀羮飯石鼎時時柏子煙三際十方俱坐斷不知誰後復誰先答天章復初法弟嘍羅智者講天台潦到盧公辨鏡臺法法無差波即水新新不住火成灰力將正説排邪説驗盡南來與北來佛日孫枝饒挺秀鐵華還向樹頭開師祖善權元翁和尚忌辰撫景感懷七首今朝五月草四日老倒禪翁恰化生佛祖位中無住著人天路上謾從衡亭亭峨石機猶峻岌岌龍巖話大行欲識善權端的旨日輪卓午打三更薰風庭院日偏長遍界明明不覆藏今雨稚松爭拔地故園新竹已過墻固知鼯鼠非他物忽聽鳴蟬報夕陽六十六年來又去了無生滅可論量病魔垂老任交攻高臥匡牀丈室中四大色身元是妄多生業障本來空華池寶所阿鼻獄火聚刀山兜率宮天上人間恣遊戲開軒徒自挹玄風櫻桃盧橘繞簷栽小小方池手自開曇諦不忘書鎮約黃梅重駕願輪來多身有待分塵剎全體那辭育聖胎薄福住山頭已白深恩何以答涓埃棟宇渠渠更故新寸長尺短妙經綸竹頭木屑知功力露柱燈籠識苦辛香積引泉來百丈層樓送目過由旬却憐坐臥經行處物物全彰淨法身為愛團欒十畞園紅芳消後緑陰連杖藜日涉真成趣野菜時挑不費錢臨濟栽松親钁地仰山種粟自燒田祖翁活計誰相委獨立南榮為惘然舐犢之情似海深誰知黃檗老婆心醍醐酥酪皆同味叉釧瓶盤等一金彈指全超法報化翻身坐斷去來今高堂素壁薰風裏遺像重瞻思不禁送相長老潛長老住宣州妙相法相次韻宛陵奚翁之故鄉朝來喜送諸孫行珍重難兄與難弟願言為法不為名雲山千里遙在目祖脈一縷尤關情日炙風吹木瓜樹描不成兮畫不成次韻答寄昭明才無學藏主錦峯山下千年寺橫翠堂中一老身晝夜心源常湛寂冰霜戒檢獨清新彌陀見在忘形友慈氏當來入幕賓願與趙州同甲子裹茶聊寄雨前春藏主職滿還承天次剛中禪師韻一氣轉一大藏教回頭故國是夫差驚群喜見英靈漢圓相休呈老作家手面生機禽虎兕頂門正眼辨龍蛇叢林秋晚看昂枿遍界開敷五葉華次韻寄開化一元禪師厭看功臣樹色蒼故山端的勝殊方桑麻原隰連香徑金碧樓臺峙寶坊瀹雪小齋雲半榻貫花新偈日千行春深四大輕安否佛祖權衡賴抑揚退歸海雲受業謝祥止菴過訪次韻散席歸休愧老蒼匡徒行道任諸方百年寄幻依雲麓午夜傳衣憶碓坊笋蕨時挑殊有味杉松手植已成行春風短䇿勞相過活計都盧為舉揚次韻答靈隱介菴應世隨緣沒奈何秋來説法喜無魔須彌椎打虗空鼓般若舟橫苦海波石子岡頭潮信早梅花洲上月明多江流不盡深深意獨許吳音唱楚歌早出餘杭感懷佛祖宏規有準繩侯門無事愧頻登蒼茫五髻三更月迢遞千巖萬壑冰心迹任教同稿木姓名何必上傳燈覺天不夜空無際寂寂行看慧日升次韻答愚仲法兄寶華白晝雨空山滿紙伽陀辱遠班頓覺五峯嘉氣集坐令千載古風還縱橫妙灑鐵鉤鎖精瑩雄辭玉佩環焚香打鼓普請看津津喜色動衰顏寄天寧白菴聞道南湖第一山交參龍象雜官班東頭賣貴西頭賤空手來時赤手還頂𩕳一機猶掣電語言三昧若連環鐵船下海休輕舉老叔談禪亦強顏答東皋伯遠法師二首東皋尊者隱郊墟小小屠蘇睹史居切柏代香朝演法卷簾進月夜紬書村園界熟秋霜後花徑苔生宿雨餘心境兩忘諸幻滅更於何處覓真如楓宸召對足光榮峻辨宏機悅衆情一妙九旬談不盡千差萬別證無生中吳大士推三傑上國高僧第一名道重金輪聖天子毗盧頂上等間行次韻寄行中法兄幢蓋東遊駐北山青鞋同踏蘚痕班十年不見風塵隔幾度空懷信息還猛虎口中撑玉箸狻猊頷下解金環剎竿倒却誰扶起爭羡拈花獨破顏次韻寄德嵓講師老倒龍潭接德山紙燈滅處管窺斑爭如東塔生機妙力挽西乾正脈還爛爛雜花真富貴澄澄性海自旋環丹崖碧嶂秋光裏一笑何當展瘦顏復次韻答愚仲法兄碌碌虗聲冒五山驅馳贏得髮毛斑宗綱委地慚無補節序奔流去不還浮世百年蛇戀窟勞生三界蟻循環聖凡平等難調制顧我疏才覺厚顏答前開元方崖法兄二首宗教人才繫重輕弟兄垂老益關情徒勞剎説仍塵説盡把風聲作雨聲勇退曾聞法雲本高間誰似覺天清尚期末路參玄士悉使歸家罷問程秋晚叢林委地空菴居小小不雷同單提獨弄三江上萬別千差一照中船子清風來夾嶠馬師異類得龐公遙知緇白交參處入夜高燒蠟炬紅悼楚石和尚三首潦倒奚翁的骨孫高年説法屢承恩麻鞋直上黃金殿鐵錫時敲白下門煩惱海中垂雨露虗空背上立乾坤秋風唱徹無生曲白牯狸奴亦斷魂聖主從容問鬼神當機一默重千鈞茶毗直下金門詔火聚全彰淨法身平地驚翻三世佛等間瞎却一城人大悲願力知多少枯木花開別是春匡床談笑坐跏趺遺偈親書若貫珠木馬夜鳴端的別西方日出古今無分身何啻居天界弘法毋忘在帝都白髮弟兄空老大剎竿倒却要人扶次韻賀象元禪師遷徑塢萬仞龍門奏凱歸山頭魚躍井塵飛生機透脫空諸有妙用縱橫顯衆微四海叢林師望重三台人物曉星稀祖翁塔所能延老擬辦遮寒布衲衣用韻寄天界全室禪師詔領宗壇萬衲歸龍河花雨日紛飛朝回曙色開黃道定起靈光繞紫微貝闕珠宮天上有法王禪將眼中稀何當一扣毗耶室笑攬金紅屈眴衣答謝前虎丘行中法兄過訪忽報雲巖老漢歸秋風瀆水片帆飛衝霄鐵鳳離金網戴角於菟出翠微勇退急流今古少相看白髮弟兄稀願同寶掌千年壽五髻峯頭一振衣次韻答天之西堂天寧活計了無錐直指宗風力主維少減多添能恰好橫該豎抹總相宜神機掣電全生殺妙語流珠燦陸離九里湖邊弘法施任教諸子廣傳持慧侍者歸吳門侍者參得禪了也戴角於菟插翅飛笑倒生公點頭石合傳隆祖袒肩衣論功何啻超乾慧唱道還看顯大機莫把間情憐老叔長江好泛鐵船歸次韻答寄佑啓宗二首麗藻天垂五色雲龍河倦客思紛紛永嘉一宿曹溪室智者兼修止觀門今古間生人物異教禪同仰法王尊放開佛手伸驢腳任使諸方謾度論風標濟濟出羣才目視雲霄臥草萊未許知心排闥起肯因傳語下山來陰涼大樹元無種般若靈苗宿有荄爭頌楚材須晉用只應僧佑衆中魁次韻悼逆川和尚潦倒川翁莫與京去來何用問前程踏翻大地無行迹撲落虗空絶謂情任爾鐵牛生犢子從他海燕作雷聲臨終説偈辭明主不比尋常蚓竅鳴次韻懷幻隱首座率衆鳳陽法會説法濠梁據上班聲傳萬國盡歡顏四花繚繞人天座百寶光嚴虎豹關赫赫神符懸肘後煌煌慧劒挂眉間三千龍象隨高步歲晚江空願早還示白禪人白業精修苦行堅未明心地更加鞭三乘教外元無法七尺單前豈有禪莫學少林空面壁從教南嶽自磨磚鐵牛掣斷黃金索鼻孔撩天不著穿龍潭舟中寄天界全室禪師詔許還山得便風吳船如屋大江東聖皇有道逾仁廟野衲非才愧璉公袞袞波濤皆睿澤寥寥天地一冥鴻三年旅食曾無補回首龍河思莫窮法城禪人化緣修磧砂經坊城禪切忌墮疑城施受論功只礙膺大法本來無一字釋尊方便説三乘輝天鑑地光明藏塞壑填溝爛葛藤隨順世緣平等化道人行處火燒冰示吳無妄居士麩金嶺下搆菟裘火種刀耕已白頭摩詰有妻稱法喜釋尊生子謂羅睺一真境界無虗妄三大僧祇孰進修識得本原心即佛火中踢出百華毬次韻示萬壽因藏主本來平等沒疏親學道應須達正因只為衆生迷寶藏直教大覺棄金輪北山密付刀頭蜜西麓全提眼裏塵石火電光猶是鈍當機無我亦無人悼開元方崖法兄丁巳十月十六日開元老漢入泥洹信腳踏翻浮佛閣全身抹過聽秋軒衆人索偈聊書偈至道離言豈有言七十一年無罣礙話行東土與西乾老禪遷化荊溪寺物物全彰淨法身蛻角泥牛耕碧落懷胎玉兔衮紅塵雙趺示相機雖妙一曲無生調轉新大寂定門來又去曇花重現少林春次韻示明禪人護龍河上寺濟濟衆如林擬欲求玄旨應須達本心能傳南嶽讓素得徑山欽日用宜高潔雲生性地陰次韻示聞維那教體音聞外真空是道場龍河機用別鷲嶺話頭長門掩三春雨身全五分香罰錢仍出院切忌錯商量贈敏侍者兼簡度白雲機用誇神敏叢林譽蚤騰永嘉憐一宿雪嶠愧三登共羡非凡種深期續祖鐙國師同在客喚爾急須譍達禪人參方雲山佳衲子宜達境唯心自説遊京國親曾訪道林話頭明歷歷腳債尚駸駸勿惜勤參禮玄門似海深示守正禪人參禪能守正邪念任紛飛試究紛飛處終歸湛寂時樅然諸境界不隔一毫釐言外知端的虗空展笑眉善住禪者參方白雲堆裏住知識久咨參既善探玄旨何妨出翠嵐諸方無別法此語貴深諳客路驚秋早頭頭為指南山樓秋夜三首月色白如晝松陰多似雲窗虗山欲墮燈灺夜初分河影中天見泉聲隔樹聞小樓成獨坐此景與誰論衰草緣幽徑疏林出短墻風回驚宿鳥露下泣寒螿歷歷無差互頭頭自顯揚跏趺坐來久重爇瓦爐香秋半山樓好匡床夜不眠感時思佛果撫景憶南泉月下機何峻更深語最玄寥寥千古意危坐獨超然寄德巖行講師七帝論心鎮國師雨窗孤坐想風姿化龍叶夢孫枝在濯濯優曇見一枝寄洞庭羅漢琛頑石書記時居祖憂秋風木葉洞庭波愁殺山中諾詎那恩愛盡時煩惱盡好攜瓶錫出煙蘿次韻危太朴翰林錢塘留別護龍河上翻經日西子湖頭立馬時話盡山雲并海月此情只許白鷗知寄普慈東堂蘭石和尚蒼雪樓頭八十翁空華幻境盡銷鎔風微晝永南山麓拄杖穿林看籜龍招衍懺首掌記二月東吳浩蕩春青天時雨講花新縵縵教網周沙界透脫須還是錦鱗罪性元空懺亦非一心三觀涉離微太虗為紙須彌筆倒用橫拈最上機念禪人禮補陀一念普觀無量劫塵毛剎海總圓通白花巖畔金剛石昨夜藏身北斗中登五雲山望江亭高亭注目正清秋野曠天空事事幽白鳥青山雲淡淡滄江斜日水悠悠示壽知客開先寺裏迎賓日禪月堂前索偈時客路如天春似海子規啼斷落花枝勝禪人歸宣州名字既同黃檗勝參禪須會趙州無昨夜宣城木瓜樹開花結箇苦胡蘆解制二首次大覺象元韻凌霄一夏九十日無佛無我無衆生昨夜秋風動林樾任教白髮長新莖九旬共喜無諸難功行誰能驗蠟人彼此住山成老大又看桑海一番新血書法華經報母筆底紅蓮朵朵開是名真法供如來指端瀝盡娘生血全體何曾出母胎福建琦禪人禮峨眉普賢大士閩蜀同風莫外求峨眉山月半輪秋玄沙不出飛鳶嶺築破娘生腳指頭用宋景濂學士韻送妥侍者回育王開本師塔銘點開鄮嶺金剛眼照破昏衢萬八千無相光中老居士話行東土與西天乞得金華學士禪絶勝荷毳獲純綿鐵鍬不用尋靈骨密意分明在汝邊贈鑷生千僧遍剃娘生髮一念全超罔極恩老我畏寒偏護頂謾勞彈鑷到雲根寄前瑞巖恕中和尚惺惺石上主人翁一室高居太白峯靖退只今非小節知心未許石門聰千里同風各莫年任教滄海變桑田獨憐熊耳峰頭月昨夜蝦蟆蝕半邊徒誇錦瑟與瑤琴妙指方能發妙音却憶鰲山深雪夜弟兄傾盡歲寒心示日本春禪人三首少林春色遍遐荒不隔扶桑與大唐三拜起來依位立無端好肉自剜瘡扶桑人種陝西田打著南邊動北邊踏遍支那知落處阿難依舊世尊前參禪只要了心地欲覓了時無了時未跨船舷三十棓老僧失却一莖眉建長明南浦四會録蟭螟眼裏五須彌靠倒虗堂老古錐四會搏桑熾然説曾無一字挂脣皮謝嚴子魯左丞惠貢餘新茶槍旗不展䇿全勛占斷江南第一春除却金輪聖天子舌頭具眼是何人寄王耕雲照磨春山老圃帶雲耕芝草琅玕滿地生讀罷楞伽日亭午海棠花下聽啼鶯示郁止齋居士學道應須達正因道原曾不離諸塵當知一切衆生界即是如來淨法身祖禪人歸五祖風流公子正法眼紅粉佳人最上機拈却東山左邊底祖天日月倍光輝義禪人歸京口次嶼雲心西堂韻直將直義報禪流法法毋勞向外求月滿淮南江水白角聲吹徹甕城秋洪武戊申浙右三宗諸山奉旨會于天界寺十僧相繼坐化吳江佑上人集遺偈成卷請題十方薄伽梵一路涅盤門苦海孤舟客徒勞刻劍痕題一雨師悼頌卷自號真實尊者稽首一雨師日用惟真實救旱自焚身精進波羅蜜
