body:
  text: 徑山興聖萬壽禪寺語錄門人希顏等編師於至正辛丑十月十七日承奉行宣政院官疏請入寺指山門云天下徑山天下龍門吐吞日月函盖乾坤佛殿頋左右云插一莖草建瓊樓玉殿拈一莖草作丈六金身山上有鯉魚井底有塳塵陞座祝贊問答罷乃云通上徹下迥絕羅籠匝地普天了無眹跡識不可識智莫能知一自拈花微咲面壁安心便見五葉流芳千燈續焰體究將來總是強生節目直饒上無扳仰下絕己躬常光見前壁立萬仞何異癩馬繫枯樁黑牛臥死水借使斬新日月逸格風規冰稜上度過九𨸰劒刃上拾得全身正好朝打三千莫打八百豈不見雲門大師道盡乾坤大地無纖毫過患猶是轉句不見一色始是半提須知更有全提時節雖然一向與麼去法堂上何啻草深一丈官不容針私通車馬二峯突兀双徑回環大覺國師願力宏深孚佑龍王淨緣際會維禪林之首剎實天下之名山不妨與諸人高掛鉢囊抝折拄杖直得八方寧謐萬姓歌謠鴉鳴鵲噪總契真源風動塵飛皆明佛事揚不揚之正化報不報之深恩正與麼時且開堂祝聖一句如何舉似擊拂子黎元頓息三災劫睿算延洪億萬春復舉僧問當山諲禪師掩息如灰時如何諲云猶是時人功幹僧云幹後如何諲云畊人田不種僧云畢竟如何諲云禾熟不臨場師云諲禪師與麼答話勞而無功這僧若是個漢決不依他作解後來應菴和尚道鳳閤香沈雪巢夜冷半窓明月和氣藹然正與麼時且道歸宗與徑山還有相見分也無喝直饒相見也是蝦蟆窟裏作活計要見四方八面逸格變通別著個眼始得新徑山莫有長處麼拍禪床云敲出鳳凰五色髓擊碎驪龍明月珠千古華山山脚下只應潘閬倒騎驢久立珍重上堂舉睦州道揑聚也在我裂開也在我有僧便問如何是裂開州云菩提涅槃真如解脫三九二十七即心即佛我且與麼道你又作麼生僧云某甲不與麼道州云𧣴子撲落地楪子成七片僧云如何是揑聚州乃斂手而坐師去大小睦州擬將織蒲鞋手籠古今自謂揑聚放開乾坤把斷要且無合殺者僧當時若是皮下有血見它與麼道但低聲向它耳邊下一轉語教他揑聚也不得放開也不得瑞浴主火堅固法身膿滴滴地火不能燒水不能洗擲火云我見燈明佛本光瑞如此上堂僧問不起一念時如何師云道者合如是進云與麼則依而行之也師云虗生浪死漢又僧問父母非我親誰是最親者師云識得不為冤進云諸佛非我道誰是最道者師云闍黎合自知僧擬議師便喝乃云今朝又是十一月卷地北風吹觱發臘月三十便到來勸君各要知時節人漸老水長流君子可八知得便𠇾上堂拈拄杖冬至一陽生拄杖長丈二石笋暗抽條千花生碓觜且衲僧分上成得個甚麼邊事莫有道得底麼有則不妨出來對眾道看若無徑山自道去也卓拄杖上堂僧問臨濟道一句中具三玄一玄中具三要如何是一句中具三玄師云萬仞峯頭駕䥫船進云如何是一玄中具三要師云眼裏瞳人吹木呌進云如何是和尚家風師云吹折門前一株松進云學人不問這個風師云汝問甚麼風進云家風師云我這裏大功不竪賞乃舉仰山示眾云汝等諸人各自回光返照莫記吾言汝無始劫來背明投暗妄想根深卒難頓所以假設方便奪汝麤識如將黃葉止啼有什麼是處師云盡十方世界是諸人自己盡十方世界是諸人本有光明為我拈針鋒許妄想麤識來看喝一喝下座上堂庚申好日逢元旦四海歌謠樂太平聖德如天何以報卓拄杖云萬年松上一枝藤上堂舉僧問長慶有問有答賓主歷然無問無答時如何慶云怕爛却那僧又問睦州州云相逢盡道𠇾官去林下何曾見一人師云長慶放頑睦州檐板等是有問有答要且未會無問無答底道理在今日忽有問徑山有問有答賓主歷然無問無答時如何只向道一曲自歌山自綠此情不與白雲知
