body:
  text: 自題門人道彝等編芷都寺請沅有芷澧有蘭花根本艶虎體元斑楊岐輔慈明匡徒只說此法鼓山佐雪峯闡化話無兩般覺斯今行斯道若丹青之寫象猶匠石之斸坐斷西湖南宕力回倒海狂瀾金圈栗棘橫該抹千古叢林作話端淨慈行堂請眼生三角頭峭五嶽心性急如弦𮌎中無點惡東海鯉魚打一棒雨似盆傾南山白額奮全威天魔膽落截斷妙喜葛藤埽蕩永明糟粕却憶老盧公辛勤在龍朔碓觜花開劫外春千古高風動寥廓延慶略長老請韜略全無威權何有皮膚脫落盡留得一張口四會說法住山一味縣羊賣狗父子雖親妙不傳喝下須彌顛倒走定慧寶長老請滿肚貪瞋癡通身戒定慧日用任縱橫非如亦非異拈來妙喜竹篦敲出臨濟骨髓南山鱉鼻噴腥風龍王宮殿波濤起中竺悟長老請老屋數椽春寂寂長松萬本晝陰陰空山盡目無餘事時聽黃鸝送好音題䟦趙魏公書楞嚴長偈梵語首楞嚴此飜一切事究竟堅固良由慶喜未全道力求佛方便故世尊示之以十方如來一門超出妙莊嚴路乃至多方決擇真妄發明陰入七大皆如來藏使悟器界萬法當體全真銷億劫顛倒妄想獲究竟堅固法身於是說偈讚佛發願度生虗空可亡心無動轉實為微妙章句松雪居士趙魏公大書特書以傳不朽書法之妙大海為口須彌為舌贊莫能及而公出處光大名滿天下碩德盛業不可思議得非楞嚴會上菩提薩埵乘大願輪一來人間遊戲者歟公非獨書是偈至若金剛般若圓覺諸大乘經皆勵精書寫鋟梓流布將此身心奉塵剎是則名為報佛恩浮俗闡提觀此亦當自化陸遜齋書華嚴經無上法王初成正覺稱法界性說華嚴經譬如虗空具含眾象於諸境界無所分別唯上乘大士信解弗疑中下之機如聾若啞吳郡遜齋陸公吏隱而事佛尤篤佐政之暇手書是經八十一卷裝潢函秘安奉五瑞山大雄寶殿以永傳持非上乘根器疇克是也觀其發大信心啟大行願不翅陰翊王度報資恩有欲壽大法無有盡滅期與極微塵剎海無盡眾生同證一真法界功德其可量哉至正壬寅余客留山中得遂披閱時公已沒於王事追授承事郎昌化縣尹木落天空秋高氣肅淨几明窻焚香展卷恍若與公游泳毗盧性海死生何閒焉秀峯徽太古所藏圓鑑寂照妙明三老遺墨老圓鑑與寂照先師蚤時嘗充書記之職各以文學鳴世厥後相繼主法雙徑為天下師表致叢林禮樂全盛四海象龍川委雲集道德之光猶日月麗乎中天亘千古而不可磨滅也時妙明太古二兄實能同參法席後三十年妙明由補陀中竺亦主雙徑今觀圓鑑贈休復子蘭說以蘭比有道君子期漸乎馨熏乎心潤乎道而周流乎天下寂照送中一上人序切切以斯道勉旃有謂非俶儻瑰瑋信之篤見之明奮不顧流俗孰能相與踔厲乎此哉之語回眎碌碌冐名竊位馳騁浮華勾章棘句不原道之所存至竟癡狂外邊走者愧當何如也太古分座說法華藏時妙明居補陀書疏往復曾弗及世諦唯以遊心華藏世界與法報化同為唱導為喜三大老可謂同一舌頭同一心知雖片言隻字未嘗不以單傳直指之道自任而其後先接踵聯輝為天下師表也宜矣太古匡徒秀峯方東南兵變之餘所至若逃亡家叢席為之特振堂中衲子數十人皆嶄嶄出頭角者一日鉢盂兩度濕不可蹔缺因行化訪余受業海雲出此俾題引紙運筆覺我形穢張居士血書法華龍勝菩薩曰眾生心性猶如利刀唯用割泥泥無所成刀日就損理體常妙眾生自粗能善用心即合本妙寂音尊者謂世之人疲精神於紙筆從事於無用之學是皆以刀割泥者也清河張居士中年割棄塵累篤志佛乘瀝娘生十指之鮮血書法華七軸之真詮是真精進是名真法供養如來端可謂善用其心者矣既書寫之又讀誦之苟能一言之下心華發明徹見一會靈山儼然未散不妨便是千佛一數居士宜加勉諸靈源清禪師遺墨靈源大士道德言行為宗門百世師表觀其遺輔公坐元小帖雖似簡率一再展卷恍若黃龍山壁立萬仞俯仰今古為之凜然與上人所藏羅漢圖諸禪四無量無色三摩提一切受想滅心量彼無有是謂阿羅漢深山大澤聖賢所都信非凡愚肉眼之所能見內秘外現應化無方出沒卷舒如幻如夢又豈筆端三昧所能彷彿好事者繪之為圖以寓遐想良有旨哉世之覽者徒愛其奇形怪狀精巧入神孰究道之所存為何如耶上人為佛之徒當觀其迹究其道自覺覺他勿墮聲聞自覺聖差別境界直趣自覺聖智究竟之地可也雖然我作是說猶如繪像若是眼裏有筋終不按圖索駿錢子善三教異同論三教學者互相矛盾其來遠矣屏山李公嘗謂儒釋道之軒輊非唯釋道不讀儒書之過亦儒者不讀釋道之書之病也君子韙之今觀彭城支離叟三教異同論窮理盡性無黨無偏可謂撤藩籬於大方之家匯淵谷於聖學之海立一家之成說埽末流之浮議使三聖人之學凋瘵之秋復將鼎峙而不致偏仆其於聖教豈小補哉雖然道本無言離文字相離心緣相世界未立三才未備儒釋道甚處得來當與麼時孰是孰非誰同誰異向這裏下得一轉語則辨論之作功不浪施其或未然待汝一口吸盡西江水却向汝道中峯和尚蓮花吟卷普應國師中峯和尚說法如雲如雨蓮花吟一篇豈亦懷淨國之遊而作耶趙魏公因而畫之為圖馮待制又從而大書特書合成一卷可謂三絕矣京口張天民獲之於烽塵澒洞之際不翅夜光明月謂是卞山幻住舊所藏者即歸諸吳門幻住照用菴為傳家之券張亦有德者歟噫中峯為東南大善知識據師子巖作師子吼垂三十年氣吞佛祖道重王臣如趙魏公馮待制皆儒林鉅擘往來參扣咸稱弟子蓋欲咨決大事因緣碎塵勞窟宅拔生死根株豈吟詠云乎哉然達人大觀游戲翰墨無非佛事用菴為中峯直下的孫得此寶諸宜矣倘能捩轉面皮伸出毛手付諸丙丁則老和尚大寂定中必為破顏一笑天童佛海禪師遺墨河南褚士文博學而尤精書法四方多士咸願遊從嘗與太白佛海為方外交徵言於海海時年八十有五能作凍蠅細字手書舊詩數十篇詶之士文寶秘珍惜時一展玩如見古道顏色雖隋珠卞璧不換或謂佛海為一代尊宿不以本分事接人遺之以詩有失大體予曰不然上乘菩薩善巧利生乃至示現種種形相與其同事佛海遺詩豈非四攝之一也噫儒與釋分兩塗跡雖不同道實靡間苟非達而不拘者往往肝膽楚越觀士文佛海之風亦當少愧佛印禪師遺墨佛印禪師竊怪叢林以文字為禪嘗示眾云雲門說法如雲如雨絕不喜人記錄其語見必罵逐曰汝口不用返記吾語異日裨販我去學者漁獵文字語言正如吹網欲滿非愚即狂蓋師荷負臨濟正傳言語道斷心行處滅䇿勵禪徒法如是故豈欺人哉觀此送茶手帖種種譬喻深入法味醍醐毒藥毒藥醍醐亦能殺人亦能活人雖知法離語言文字而能遍一切處如實為人演說於師見之矣全室禪師法語說法不應機總是非時語故先佛世尊隨宜演說良有旨哉今觀全室禪師鍾山法會奉旨普說窮理盡性徹果該因顯密淺深無機不被真得先佛之意深與契經相合贊西堂得而寶諸可謂具一隻眼題白菴禪師三會錄向上一路離言說相離文字相諦觀白菴禪師三會錄一一從自己胸襟流出言滿天下未嘗道著一字松源和尚云正路行者有但不能用黑豆法難以荷負正宗大慧老祖云諸方說禪彎彎曲曲如海螺兒相似我這裏則不然開著口便見心肝五臟此錄二者兼得之矣師得法上首衍慶澤長老結集鋟梓以惠後學同器而食色有異覽者自宜著眼塔銘前翰林學士承旨嘉議大夫知制誥兼脩國史兼太子贊善大夫金華宋濂撰浙河之西山川清妍其所毓人物性多敏慧學禪那者以攻辭翰辨器物為尚雖據位稱大師亦莫不然自宋季以迄于今提唱達摩正傳追配先哲者惟明辨正宗廣慧禪師一人而已師諱智及字以中蘇之吳縣顧氏子父茂卿母周氏師之始生靈夢發祥及入海雲院為童子智光日顯釋書與儒典竝進其師嘉之同見閩國王清獻公都中公大賞異留居外館撫之如己子使其祝髮受具足戒師聞賢首家講法界觀往聽之未及終章莞爾而笑曰一真法界圓同太虗但涉言辭即成賸法縱獲天雨寶華於我奚益哉遂走建業見廣智訢公於大龍翔集慶寺廣智以文章道德傾動一世如張文穆公起巖張潞公翥危左丞素皆與之游以聲詩倡醻為樂師微露文采珠潔璧光廣智及羣公見之大驚交相延譽唯恐後師之同袍嶼上人呵曰子才俊爽若此不思負荷大法甘作詩騷奴僕乎無盡鐙偈所謂黃葉飄飄者不知作何見解師舌噤不能答即歸海雲胸中如礙巨石目不交睫者踰月忽見秋葉吹墜于庭豁然有省機用彰明觸目無障師雖自慶幸然不取正有道恐涉偏執於是杖䇿遊虎林升雙徑山謁寂照端公自列其所證甚悉初寂照嘗以法器期師聞其言喜甚因勘辨之師隨機而答隼落秋空而兔走荒原也精神參會不間一髮未幾命執侍左右以便咨叩俄遷主藏室師取三乘十二分教益溫繹之宗通說貫袞袞如懸江河聲光煒燁頓超諸老上元至正壬午江南行宣政院舉師出世昌國之隆教海濵之民暨清淨四眾手持香華百里驩迎如見諸佛師為升座說法不翅大將樹建旗鼓申令發號聞者靡不畏服乙酉轉隣剎普慈其激揚誘掖如隆教時戊戌江淛行省左丞相達識帖穆爾兼領院事延師主杭之淨慈兵燹之餘囏窘危厲人所不能堪師運量有方軌範峻整綽有承平之遺風較之普慈君子恒謂過之丞相猶謂未盡尊師之道辛丑之秋復請住持徑山補寂照故處師亦不辭而往風動四方考德者愈眾亡賴男子瞿範日饕盤飱主庖者厭之瞿銜而去赴部使者訴院之僚屬受賕誣師為通衷私使者攝師問狀師了無懼色癸卯省憲二府白其冤強師復還徑山緇素駿奔如戴父母至有樂極而悲泣者皇明龍興洪武癸丑詔有道浮屠十餘人集京師大天界寺而師實居其首以病不及召對乙卯賜還穹窿山山即海雲所在也戊午八月忽示微疾至九月四日索筆書偈而逝九日行茶毗法火𦦨化成五色有氣襲人如沈水香齒牙數珠不壞遺骨紺澤類青流離色室利羅交綴於上是日其徒大均士龍等藏於所居之山陰寶盈分爪髮歸徑山卜於無等才公塔右瘞焉世壽六十八年為僧五十一夏度弟子若干人嗣其法者若干人師長身山立昂然如孤松在壑威令嚴肅其下無敢方命故所至百廢具興然處事達變接引後進又如春風時雨之及物使人不自知元帝師以為賢為錫今號云師在天界時濂頗獲聞其緒論於其歿也上首弟子普慶住持道衍藉是之故自狀其行來請銘夫圓明妙性實具三千四聖六凡悉從中現諸佛不得已而說經雷動蟄驚風行草偃者為明此性也諸祖不得已而忘經絕其枝末直探本根者亦明此性也性在是則道在是矣柰何道喪性乖非惟學徒為然至於師表當世者壹從事於末學曲蓻之間以資清玩其去佛祖之道蓋亦遠矣有如師者可不表之以為東南龜鏡哉師出世時穹窿山石夜走及涖普慈神降於人述師清嚴之狀天之生師殆不偶然四會語有錄其機緣已備載之茲不敢勦入也銘曰華梵諸祖所了惟心函乾蓋坤開陽闔陰萬彚芸芸靡不苞括肯捐全軀而局一髮奕葉相仍軌轍弗殊融通小大無礙無拘猗歟禪師神觀孤聳文采漸彰雲流山涌一旦易慮面壁自治攝念入定如斬棼絲秋葉之零飄墮庭仰視青天一碧萬里我性之覺證諸碩師機鋒交觸劍戟差差出世海濵人天拱手發祥含徵白石夜走全提正印法鼓頻撾以眼聞者斷除空華由其見凝轉識為智珠璣落紙亦第一義方嶽大臣遣使候迎陟于南屏惟德之馨名山列五首曰雙徑匪私于師東南龜鏡輕儇小夫憯不自懲皦皦白璧何憂蒼蠅風騰波掀萬辭嗟惜是非既昭重涖舊席昔師之去泉流哭聲師今之旋卉木含榮世緣已終微笑而滅設利如珠綴于紺骨末學競奔曲藝宏施胡不反觀本實在斯遺光所被千載猶淺瞻之仰之誰敢不勉
