body:
  text: 小參門人忻悟等編解夏小參僧問德山小參不答話藥山小參不點燈趙州小參要答話是法平等因甚三段不同師云舌頭不出口進云溈山問仰山一夏作何功業仰云鉏得一片畬種得一籮粟還當宗乘也無師云嚗嚗論寔事進云仰山却問溈山和尚一夏作何功業溈云日中一餐夜後一寢又且如何師云渠儂得自由乃云目前無法法法樅然心外無機機機相副豈不見溈山問仰山子一夏在山作何功業仰云開得一片畬種得一籮粟溈云恁麼則不空過一夏仰山却問溈山和尚一夏在山作何功業溈云日中一飡夜後一寢仰云恁麼亦不空過一夏看他從上尊宿又何曾有絲毫奇特道理一切只是尋常自然聲和響順投子云諸人變見千般總是自擔帶將來趙州道喫粥了也未喫粥了也洗盂去天高地厚海闊山遙月白風清蛩吟蟬噪行者擊鼓山僧小參諸人簇簇上來討個什麼拈拄杖劃一劃云凉飈動寰宇一葉已驚秋除夜小參僧問芻狗吠時天地合木鷄啼後祖燈輝一年光景今宵盡萬里更無人未歸見前一眾盡是他鄉之客即今歲盡年窮如何得便歸家去師云闍梨家在什麼處進云僧問藥山學人擬欲歸鄉時如何山云汝父母徧身紅爛臥在荊棘林中汝歸何所意旨如何師云愁人莫向愁人說進云僧云恁麼則不歸去也山云切須歸去汝若歸去我示汝個休粮方僧便請山云二時上堂不得咬破一粒米又且如何師云藥山老漢得恁麼老婆心切進云且那裏是他老婆心切處師云闍梨要問長老口啞那僧便退師云芻狗吠時天地合木鷄啼後祖燈輝一年光景今宵盡萬里更無人未歸好大眾古人與麼道只要你直下識取自家城郭免見倚他門戶傍他墻剛被時人喚作郎久參先德不隔絲毫後學初機宜加審細豈不見僧問藥山學人擬欲歸鄉時如何山云汝父母徧身紅爛臥在荊棘林中汝歸何所僧云恁麼則不歸去也山云却須歸去汝若歸鄉我示汝個休粮方僧便請山云二時上堂不得咬破一粒米若喚作休粮方正是還鄉曲謂是還鄉曲又道休粮方老藥山赤心片片憫物垂慈其柰十個有五雙蹉過至竟不解知歸逗到彌勒下生轉見流離孤苦長沙和尚道我若舉揚宗教法堂上草深一丈事不獲已向諸人道盡十方世界是沙門一隻眼雪峯又道盡大地撮來如粟米粒大到者裏不敢望汝別縣慧日獨振玄風但向古人鶻臭布衫上知些子氣息一年三百六十日一日朝昏十二時東廊上西廊下穿僧堂入佛殿總是到家時節轉山河國土歸自己轉自己歸山河國土如壯士展臂不假他力天上人間縱橫自在苟或未然烏飛兔走臘盡春回明朝慶賀新陽各各又添一歲莫將有事為無事爭是爭非空白頭復舉僧問洞山寒暑到來如何回避山云何不向無寒暑處去僧云如何是無寒暑處山云寒時寒殺闍梨熱時熱殺闍梨師云洞山老漢與麼答話非唯儱侗真如亦乃瞞頇佛性忽有問隆教寒暑到來如何回避也只答他道何不向無寒暑處去更問如何是無寒暑處和聲便打若是識痛痒漢管取出離五行三界淨慈入院小參僧問日可冷月可熱眾魔不能壞真說如何是真說師云風動塵飛鴉鳴鵲噪進云欲識永明旨門前一湖水拈却門前一湖水如何是永明旨師豎起拂子進云即此用離此用師放下拂子又俗士問弟子欲出離生死如何用心即得師云無心可用即離生死進云即心是佛又且如何師云心空即是佛有心即非佛士擬議師便喝乃云馬祖百丈已前無住持事道人相尋於空間寂寞之濵其後雖有住持王臣尊禮為人天師今則不然掛名官府如有戶籍之民此晦堂不赴大溈之招而致斯語觀此則知住持之道那時已是不堪著眼了也更教看著今時做處也好慚惶煞人明教謂住持者持其法使之永住而不滅所以法隨法行法幢隨處建立永嘉道建法幢立宗旨明明佛敕曹溪是世降俗末名存寔亡大法凋瘵無甚今日山僧道慚涼薄行愧荒疎誓欲深藏巖壑隱遯過時悞蒙柱國丞相不忘靈山付囑遠勞使命推輓來此住持是猶使蚊負山螳蜋怒臂以當車轍却不似法燈和尚道為緣先師有未了公案出來為他了却所謂王臣尊禮為人天師建法幢立宗旨則吾豈敢雖然南屏勝地衲子淵藪人能弘道非道弘人佛運垂秋宗綱委地冀諸勝眾戮力匡持弘贊法社驀拈拄杖你有拄杖子我與你拄杖子你無拄杖子我奪却你拄杖子卓拄杖云三級浪高魚化龍癡人猶戽野塘水復舉德山小參示眾云今夜不答話問話者三十棒時有僧出禮拜山便打僧云某甲話也未問為甚打某甲山云你是甚處人僧云新羅人山云未跨船舷好與三十棒後來法眼益云大小德山話作兩橛圓明密云大小德山龍頭蛇尾雪竇拈云二尊宿雖善裁長補短捨重從輕要見德山老漢亦未可在何故殊不知德山握閫外之威權有當斷不斷不招其亂底劍諸人要識新羅僧麼只是撞著露柱底瞎漢師云這個公案諸方老宿每至小參未嘗不拈出註解一上雖則各資一路未免所見不同互有得失法眼云話作兩橛易分雪裏粉難辨墨中煤圓明云龍頭蛇尾只見波濤涌不見海龍宮雪竇道德山握閫外之威權有當斷不斷不招其亂底劍正是扶強不扶弱殊不知大小德山當斷不斷自招其亂諸人要識這僧子過新羅解制小參舉東山和尚示眾云百鍊黃金鑄鐵牛十分高價與人酬庭前不有花含笑又是東山一夏休亦成一偈舉似大眾鼻孔撩天水牯牛鐵鞭三百未輕酬溪東牧了溪西牧又是南屏一夏休冬至小參僧問說法不應機總是非時語如何是應機底法師云汝問我答進云生死交謝寒暑迭遷如何是不遷義師云冬至寒食一百五乃云群陰欲去未去之際一陽欲生未生之時伐賁鼓以考鴻鐘會人天而提祖令今夜不說菩提涅槃真如解脫不說即心即佛非心非佛不是心不是佛不是物洞山掇退果卓祭鬼神茶飯阿誰肯喫慈明揭榜堂前弄胡孫家具笑殺傍觀叉手進前進前叉手奴見婢慇懃天寒人寒大家在這裏無孔鐵椎魯公臺上書雲漢女宮中測日知時識節却堪持論自餘立機立境行棒行喝全鋒敵勝同死同生正按傍提橫來豎去和泥合水截鐵斬釘七十三八十四等是鬼家活計於諸人分上料掉沒交涉喝一年三百六十日四時八節春了夏夏了秋秋了冬不覺不知過了三百六十日明朝便是冬至前來許多絡索既是總用不著自己分上合作麼生喝點鐵化為金玉易勸人除却是非難靈隱平山林和尚對靈小參正法眼藏涅槃妙心廓三際以無去無來洞十虗而非中非外諸佛知之而獨用眾生日用而不知故我靈隱堂上平山和尚赤手提持袒肩擔荷權寔照用俱備擒縱殺活皆全五處住山風行草偃王臣為之斗仰魔外為之冰消塵塵剎剎普見威權物物頭頭全彰奇特高超十地迥出三乘有時拈一莖草作丈六金身有時將丈六金身作一莖草於一毫端現寶王剎坐微塵裏轉大法輪出沒卷舒縱橫自在以此穿三世諸佛鼻孔以此換歷代祖師眼睛以此坐天下善知識舌頭以此斷叢林衲僧命脈以此造無閒業鑊湯爐炭刀山劍樹碓搗磨磨為一切人抽釘楔解粘去縛以此開甘露門示甘露器令諸眾生入甘露室食甘露味機機透脫法法融通末後全提甚生光彩聲前非聲色後非色蚊子上鐵牛無你插觜處直得飛來峯起舞三臺西子湖動搖六震正與麼時是汝諸人還知老和尚落處麼卓拄杖云煩惱海中為雨露無明山上作雲雷復舉世尊涅槃會上摩胸告眾云汝等當觀吾紫磨金色之身瞻仰取足無令後悔若謂吾滅度非吾弟子若謂吾不滅度亦非吾弟子師云釋迦老子四十九年三百餘會說法如雲如雨大機大用千聖窺覰不及萬靈捫摸無由因甚逗到涅槃會上一個渾身不解作主直至摩胸告眾普請觀瞻當時眾中忽有個皮下有血出來道咄瞿曇瞿曇沒處去沒處去非唯進且無門退亦無路管取求生不得生求死不得死淨慈今夜不是壓良為賤撿點將來爭似我平山和尚五會說法高聳人天撒手去來斬釘截鐵拍禪床云踏碎虗空赤脚行十方世界阿剌剌冬至因事小參千載南屏古道場目前無法可論量羣陰銷盡陽生也四海同瞻化日長如是則鐘鼓山林依舊太平氣象維新人人脚跟下輝大寶光個個頂門上開正法眼鵲噪鴉鳴深談寔相牧謳漁唱共演真乘當頭坐斷八面玲瓏正令全提十方通暢有時奪人不奪境有時奪境不奪人有時人境兩俱奪有時人境俱不奪臨濟大師滿肚無明通身擔板要且費力不少居一切時不起妄念於諸妄心亦不息滅住妄想境不加了知於無了知不辨真寔釋迦老子釘樁搖櫓抱橋柱澡浴有什快活處山前一片閒田地叉手丁寧問祖翁幾度賣來還自買為憐松竹引清風老東山雖則熟處難忘却較些子忽有個衲僧出來道長老長老恁麼也得不恁麼也得喝和泥合水漢不見道時人住處我不住時人行處我不行不是與人難共住大都緇素要分明復喝一喝復舉僧問古德萬境來侵時如何德云莫管他師云萬境來侵莫管他情塵瞥起便周遮大圓寶鑑明如日漢現胡來等不差除夜小參一年三百六十日今當極盡之夜諸人還猛省麼是日已過命亦隨減如少水魚斯有何樂真淨和尚云唯二乘禪定寂滅為樂是為真樂學般若菩薩法喜禪悅為樂是為真樂三世諸佛慈悲喜捨四無量心為樂是為真樂石霜普會云休去歇去冷湫湫地去是謂二乘寂滅之樂雲門云一切智通無障礙拈起扇子云釋迦老子來也是謂法喜禪悅之樂德山棒臨濟喝是謂三世諸佛慈悲喜捨之樂除此三種樂外不為樂也喝老雲菴慈悲之故有落草之談雖則扶他先作未免簧鼓後昆若是羅籠不住呼喚不回逸格變通底灼然別有生涯決不依他作解不見神鼎禋禪師道是日已過命亦隨減如少水魚有何不樂便恁麼去可殺省力教中謂之隨順覺性成法破法皆名涅槃智慧愚癡通為般若菩薩外道所成就法同是菩提無明真如無異境界諸戒定慧及淫淫癡俱是梵行地獄天宮皆為淨土有性無性齊成佛道喝清平世界切忌訛言釋迦老子教壞人家男女合與二十拄杖放過則且寘若要依而行之直須寔到這個田地始得山僧從年頭至年尾未嘗不以此一著子為汝諸人然終不敢錯誤諸人一毫許蓋為各各眼橫鼻直脚踏地頭頂天其柰異生見解我執不同又爭怪得大凡小參謂之家教今夜不惜口業更為諸人舉話普請大家證入如何是佛麻三斤如何是佛乾矢橛喝一喝復舉僧問香林如何是衲衣下事林云臘月火燒山應菴和尚云香林恁麼道老鼠入牛角有問歸宗只向道明年更有新條在惱亂春風卒未休師云潦倒香林錯下名言未免遭人點撿臘月火燒山與他衲衣下事有甚麼干涉直饒應菴道明年更有新條在惱亂春風卒未休也未夢見他衲衣下鶻臭氣在再住徑山小參僧問大慧和尚昔日再住此山有云去是住時因住是去時果去住與果因無可無不可且如何是去是住時因師云五九盡日定逢春進云如何是住是去時果師云飯顆山頭逢杜甫進云去住與果因無可無不可還端的也無師云這裏是甚麼所在說去說住說因說果又有僧問如何是真如佛性師云徑山門下無這般閒家具進云鹽官道一切眾生有佛性溈山又道一切眾生無佛性未審有之與無孰是孰非師云是則總是非則總非進云和尚大善知識何得儱侗真如瞞頇佛性師云老僧入院事煩乃云去是住時因住是去時果去住與果因無可無不可喝這裏是什麼所在說去說住說因說果說可說不可雖然如是這裏却有個好處且道好在甚麼處良久云再理舊詞連韻唱村歌社舞又重新驀拈拄杖大慧祖師來也大慧好處山僧與麼舉似彼此共知好則好且道還有為人處也無愚菴固是無些子好處忝為大慧的孫也要與諸人露個消息去住休論果與因拈拄杖云一回拈起一回新卓拄杖若知撲落非他物擲下拄杖始信縱橫不是塵復舉乾峯示眾云舉一不得舉二放過一著落在第二師云乾峯與麼道入地獄如箭射畢竟如何二由一有一亦莫守日午打三更面南看北斗除夜小參僧問如何是先照後用師云拈起少林無孔笛等閒吹出萬年歡進云如何是先用後照師云琱弓已挂狼煙息萬里謌謠賀太平進云如何是照用同時師云泥牛吼處天關轉木馬嘶時地軸搖進云如何是照用不同時師云猶握金鞭問歸客夜深誰共御街行進云今歲今宵盡明年明日催如何是不屬陰陽消長一句師云待凌霄峯點頭即向汝道乃云今歲今宵盡世事悠悠何時而盡明年明日催只知事逐眼前過不覺老從頭上來寒隨一夜去去去寔不去春逐五更來來來寔不來既是寒隨一夜去且如何說個去去寔不去春逐五更來又如何說個來來寔不來合水和泥豈堪持論斬釘截鐵未稱全提北禪分歲烹露地白牛遭人追納皮角平地造妖捏怪徑山今夜小參與諸人聚集片時雖則尋常事例也是醉後添盃東山演祖云汝等諸人見山僧竪起拂子便作勝解及乎山禽聚集牛動尾巴却作等閒殊不知檐聲不斷前旬雨電影還連後夜雷阿呵呵會也麼甜瓜徹蒂甜苦瓠連根苦達磨大師非是祖復舉僧問雲門如何是雲門一曲門云臘月二十五僧云唱者如何門云且緩緩師云雲門一曲村謌社舞足可施呈較之黃鍾大呂白雪陽春大欠音律在今夜忽有問如何是徑山一曲只向道臘月二十九唱者如何明年更有新條在惱亂春風卒未休且道與雲門相去多少拍禪床下座結夏小參僧問纔過中春又逢首夏依時及節句乞師直指師云薰風自南來殿閣生微凉進云僧問雲門如何是諸佛出身處門云東山水上行圓悟道薰風自南來殿閣生微凉老妙喜因甚向這裏悟去師云聽事不真喚鐘作甕進云和尚今日舉揚學人何不解悟師云汝迷來多少時也乃云九旬禁足魚投網三月安居鳥入籠生殺盡時蠶作蠒如何透得這三重以拂子敲禪床三下云向這裏一時透取好白雲端和尚云古人留下一言半句未透時撞著鐵壁相似忽然一日覰透後方知自己便是鐵壁棒打石人頭嚗嚗論寔事復敲三下云這裏透得徹去踏破天關掀翻地軸肩橫日月背負須彌只恐不是玉是玉也大奇又敲三下云這裏透不徹去亦能受用自在如龍得水似虎靠山人皆苦炎熱我愛夏日長薰風自南來殿閣生微凉任運流入薩婆若海這條通天活路千聖共行雖不可以告人要且瞞諸人一點不得然則功多業熟職到威成若是恁麼人方明恁麼事喝五陵公子遊花慣未第貧儒感慨多冷地看他人富貴等閒無柰幞頭何復舉大愚芝和尚示眾云大家相聚喫莖虀若喚作一莖虀入地獄如箭射大眾還知大愚為人處麼聽取一頌有口不吞三世佛大家相聚喫莖虀雖然冷淡無滋味一飽能消萬劫饑冬至小參僧問道遠乎哉觸事而真喚甚麼作真師云千年無影樹進云聖遠乎哉體之即神喚甚麼作神師云今時沒底靴進云羣陰欲去未去之際一陽欲生未生之時還有佛法也無師云鐘作鐘鳴鼓作鼓響進云今古應無墜分明在目前師云莫眼花僧禮拜師乃云恁麼恁麼獼猴弄黐膠不恁麼不恁麼鰕跳不出斗恁麼中不恁麼識取鈎頭意莫認定盤星不恁麼中却恁麼捉得玉麒麟元是金師子驀拈拄杖云還見麼又卓云還聞麼聞見分明是個什麼不是心不是佛不是物釋迦掩室於摩竭耳朵兩片皮淨明杜口於毗耶牙齒一具骨冷水浸冬瓜大家廝鶻突尀耐個周金剛不識好惡見僧入門便棒臨濟小廝兒不分緇素見僧入門便喝諸佛出世以訛傳訛祖師西來將錯就錯各各分上誰不丈夫伶俐者聞與麼道笑破娘生鼻孔傝者轉見無繩自縛所以道般若如大火聚近之則燎却面門又如師子筋琴撫之則羣音頓絕山僧今夜坐地待你搆取搆得搆不得未免喪身失命喝如我按指海印發光汝暫舉心塵勞先起雖然如是善舞太阿終不自傷其手放一線路有個商量劃拄杖云羣陰剝盡又劃云一陽復生五髻彩雲呈瑞九霄紅日添長隨緣自在任運徜徉會得山門朝佛殿定知廚庫對僧堂復舉溈山示眾云仲冬嚴寒年年事運推移事若何仰山叉手進前立溈云我情知你答者話不得却問香嚴嚴云某甲偏答得者話溈山理前問嚴進前叉手立溈云賴遇寂子不會師云叉手進前進前叉手描也描不成畫也畫不就老溈山真傑斗肯一不肯一舌頭不出口父子雖親妙不傳八角磨盤空裏走除夜小參時節易過大年夜瞥爾到來心地未明諸仁者急著精彩萬法是心光諸緣唯性曉本無迷悟人只要今日了蘇武牧羊海畔長日欣然李陵望漢臺邊終朝笑發東村王老夜燒錢忙者自忙閒者閒東方甲乙木一則三三則一趙州東壁掛胡盧觀音院裏有彌勒復舉浮山和尚除夜示眾云老矣聊隨粥飯緣浮山無法與人傳夜深各自歸堂去放下情懷且過年浮山老人與麼提唱美則美矣要且無為人處徑塢輒賡一偈切希聽取海眾同居結淨緣少林消息本無傳寒來暑往誰相委荏苒浮生又一年吳江張伯琮薦母請對靈小參師云通上徹下迥絕羅籠帀地普天了無眹迹不是心不是佛不是物三乘由之而建立五性自此而出分可以起死回生可以轉凡成聖可以拔苦與樂可以轉女成男可以回三毒為三聚淨戒轉六識為六波羅蜜回煩惱為菩提轉無明為大智如是則成法破法皆名涅槃智慧愚癡通為般若盡十方世界是唯心淨土盡十方世界是本性彌陀盡十方世界是大解脫場盡十方世界是妙莊嚴域無邊剎境自他不隔於毫端十世古今始終不離於當念教中道一念普觀無量劫無去無來亦無住如是了知三世事超諸方便成十方淑真安人與麼會得便知四十九年前由此一念而生生無所生人間天上任縱橫四十九年後由此一念而滅滅亦非滅千江有水千江月生滅二圓離紅爐飛白雪正恁麼時諸人還知淑真安人歸根得旨底消息麼豎拂子看看無量壽世尊即今在拂子頭上現無量廣大神通放無量妙寶光明奏無量妙寶音樂散無量妙寶香花樹無量妙寶軒蓋與我淑真安人竝駕齊驅𢹂手同歸極樂世界去也可謂殊勝中殊勝奇特中奇特顧左右云天碧太湖三萬頃分明八德藕花池
