body:
  text: 普慈禪寺語錄門人溥震等編師於至正乙酉十月初一日受請入寺佛殿燒香云前三後三日面月面急須著眼看仙人莫看仙人掌中扇祖堂昆明池裏失却劒曲江江頭撈得鋸須彌峯頂浪滔天大洋海底蓬塵起大小祖師口門無齒陞座祝讚罷僧出問云隆教適聞撾退鼓龍峯又見踞猊床出群標格天然別不比諸方孟八郎正恁麼時時節因緣則不問四眾臨筵願聞法要師云山僧剃頭五日一次進云和尚與麼答話莫不得麼師云好人不肯做直要屎裏臥進云三聖道我逢人則出出則不為人意旨如何師云枯葉知天風進云興化道我逢人則不出出則便為人又作麼生師云海水知天寒進云和尚今日逢人則出出則為人豈不出它古人一頭地師云莫亂統進云世尊出世梵王前引帝釋後隨和尚為甚麼不許學人讚嘆一句師云向汝道莫亂統僧禮拜歸眾師乃云道業無成愧昔賢行藏去住謾隨緣自憐宿債難逃避又向滄溟駕鐵船其奈大法陵遲時當象季新長老用盡神通又且如何施設敢請文殊普賢為普慈打篙搖櫓勢至觀音張帆把柂見前勝流交相唱和但能同德同心自然無可不可不住此岸不住彼岸不住中流直教盡十方塵毛剎海愚癡下劣貧苦疲乏穢惡不淨眾生任運流入薩婆若海為依為怙正與麼時且風恬浪靜共樂清平一句又作麼生道竪拂子云天高群象正海闊百川朝上堂拈拄杖云十地驚心二乘罔測卓拄杖云子承父業賺殺多少人靠拄杖下座上堂舉雲門道若說菩提涅槃真如解脫是燒楓香供養你若說佛說祖是燒黃熟香供養你若說超佛越祖之談是燒餅香供養你歸依佛法僧下去師云雲門氣宇如王却作座主見解普慈道若說菩提涅盤真如解脫是將黑豆換你眼睛若說佛說祖是將木槵子換你眼睛若說超佛越祖之談是將魚目換你眼睛歸依佛法僧下去上堂僧問眾生為解礙菩薩未離覺和尚作麼生師云天寒日短兩人共一椀進云如何是清淨法身師云月色和雲白松聲帶雨寒乃云時節不相饒又逢臘月旦昨日地搖六震今朝天雨四花你諸人只管瞌睡冬行春令則不問面南看北斗一句作麼商量上堂僧問藥山示眾云我有一句子待特牛生兒即向汝道未審是那一句師云千手大悲提不起進云時有僧出云特牛生兒也只是和尚不道山喚侍者將燈來僧便抽身歸眾意旨如何師云一對鴛鴦畫不成乃云今朝正月十五開却千門萬戶斬新舊日風規掃蕩陳年露布良久云春暖畫堂多富貴夜深燈月兩相宜上堂僧問釋迦已滅彌勒未生正當今日佛法委付何人師云老僧打退鼓進云前無釋迦後無彌勒還有參學分也無師云風不來樹不動乃云目前無法心外無機皇風蕩蕩民物熈熈花霏霏日遲遲高下林巒錦綉圍却恠長時杜䳌子春山無限好猶道不如歸燈都寺火舉火把云漏燈𧣴子照破歷劫生死昏衢盡十方世界是個大涅盤門頋左右夜來何處火燒出古人墳一日新到僧參師問甚處來僧云補陀禮拜觀音來師云觀音菩薩將錢買胡餅放下手却是饅頭作麼生會僧云學人乍入叢林乞和尚慈悲指示師驀拈拄杖云東海鯉魚打一棒雨似盆傾會麼僧擬進語師便打云若到諸方不得錯舉祈雨看經上堂舉睦州看華嚴經次有僧問是甚麼經州云大光明雲青色光明雲紫色光明雲那邊是甚麼雲僧云南邊是黑雲州云今日定有雨師云睦州將錯就錯瞞這僧則易瞞普慈則難山門今日看經設有僧問是甚麼經只向道扇子𨁝跳上三十三天築著帝釋鼻孔東海鯉魚打一棒雨似盆傾豐年野老謳歌甚在處嘉禾合穗生下座上堂趙州道個洗鉢去其僧豁爾知歸鳥窠吹起布毛侍者當下得旨阿呵呵囉囉哩達磨老臊胡打落當門齒上堂舉南泉示眾云自小牧一頭水牯牛擬向溪東放不免食他國王水草擬向溪西放不免食他國王水草不如隨處納些些總不見得有僧舉似雲門門云南泉水牯牛隨處納些些且道在牛內納牛外納直饒說得納處分明我更問你索牛在師云王老師道十八上便解作活計只個水牯牛也不解牧得累他雲門騎牛覔牛普慈這裏自小牧一頭水牯牛不免食他國王水草只是不曾犯人苗稼有時牽梨拽杷有時臥月眠雲飢則加飡渴則就飲數十年來但恁麼過且道與南泉相去多少召眾云千頭萬頭但識取一頭上堂廣尋文義鏡裏求形息念觀空斬頭覔活總不與麼無孔鐵鎚劃拄杖三邊不用安戈甲萬里歌謠賀太平普請㘽松上堂僧問記得臨濟在黃檗㘽松次檗云深山裏㘽許多松作什麼濟云一與山門作境致二與後人作標榜道了以钁打地三下意旨如何師云今日普請㘽松進云可謂峻硬不得問著師云少神作麼進云黃檗道雖然如是子已喫吾三十棒了也不知臨濟當時過在什麼處師云你道臨濟合喫棒不合喫棒進云喫棒且置濟以钁打地三下作噓噓聲畢竟明什麼邊事師云明钁頭邊事進云黃檗道吾宗到汝大興於世還端的也無師云一句合頭語萬劫繫驢橛僧禮拜而退師復舉臨濟在黃檗㘽松公案乃云諸人要做臨濟兒孫則且置只如黃檗道雖然如是子已喫吾三十棒了也且道臨濟當時過在什麼處應菴云養子之緣固當如是扶強不扶弱濟以钁打地三下復作噓噓聲為是啐同時為復別有道理普慈向這裏擬著個眼也要諸人瞥地卓拄杖雪後始知松栢操事難方見丈夫心出莊歸請知客上堂昨日過南莊今朝又東郭動靜與去來何曾有間隔然則動則涉塵勞之境靜則沉昏醉之鄉動靜双泯則落空亡動靜双行則瞞頇佛性七十三八十四途路之樂不如在家喝誰在畫樓沽酒處相邀來喫趙州茶上堂山田脫粟飯野菜澹黃虀喫則從君喫不喫任東西知恩者少負恩者多上堂僧問佛法禪道相去多少師舉手云展則成掌握則成拳僧禮拜師云狂狗趂塊乃舉保寧勇和尚示眾云風鳴條雨破塊曉來枕上鸎聲碎蝦䗫蚯蚓一時鳴妙德空生都不會都不會三個成群四個作隊窅窅窕窕飄飄搖搖向前村後村折得梨花李花一佩兩佩師云右軍筆畫入石三分李杜文章光𦦨萬丈老保寧可謂盡善盡美點撿將來未免咲破衲僧鼻孔何故要且無佛法道理普慈又作麼生乃云蒲團上端坐針眼裏穿線西風一陣來落葉兩三片上堂道遠乎哉觸事而真聖遠乎哉體之即神雲門乾矢橛洞山麻三斤罕逢穿耳客多遇刻舟人上堂舉僧問乾峯十方薄伽梵一路涅槃門未審路頭在什麼處峯拈拄杖劃一劃云在者裏雲門拈起扇子云扇子𨁝跳上三十三天築著帝釋鼻孔東海鯉魚打一棒雨似盆傾師云涅盤心易曉差別智難明乾峯雲門雖則各資一路瞞者僧即得點撿將來等是行於邪道普慈今日設有僧問十方薄伽梵一路涅盤門未審路頭在什麼處只向道家家門首透長安解夏進退兩序上堂有進有退有結有解左之右之風流儒雅鐘樓上念讚床脚下種菜勝首座道猛虎當路坐卓拄杖一雨普滋三草二木上堂凡夫實謂之有二乘析謂之無緣覺謂之幻有菩薩當體即空雲門道衲僧見拄杖但喚作拄杖行但行坐但坐總不得動著師云一切賢聖皆以無為法而有差別便下座中秋謝開口耆舊上堂僧問百丈示眾云汝為我開田了我為汝說大義有僧開田了便問開田了也請和尚說大義丈展開兩手且道是說不說師云一舉四十九進云恁麼則天人群生類皆承此恩力師云汝分上作麼生進云和尚今日開田功昭百世學人請和尚說大義畢竟如何展演師云爛泥裏有刺僧禮拜師乃云百丈開田說大義大舒兩手龍峯開田謝主事豈可空然擊拂子一片月生海幾家人上樓上堂世尊三昧迦葉不知迦葉三昧阿難不知阿難三昧商那和脩不知普慈三昧諸人不知諸人三昧各各不知所以道譬如河中水川流競奔逝各各不相知諸法亦如是又如大火聚猛焰同時發各各不相知諸法亦如是喝將謂合有與麼說話上堂僧問竺士大仙心東西密相付如何是密付底心師云九秋黃葉亂飄金進云和尚莫將境示人師云老僧罪過乃云蹔時斂念是處是彌勒無門無善財分爾有心土石山河瓦礫荊棘不是神通妙用亦非法爾如然萬象之中獨露身唯人自肯乃方親昔年謾向途中覔今日看來火裏氷喝一喝下座上堂舉藥山久不上堂院主白云大眾久思和尚示誨山云打鍾著主聲鍾眾集山便歸方丈主隨後云和尚許為眾說法因甚一言不措山云經有經師論有論師又爭恠得老僧師云藥山老漢當斷不斷反招其亂當時待他道大眾久思和尚示誨拽拄杖劈脊便棒非徒截斷者僧舌頭要且不失為天下宗匠請首座都監寺并謝監收上堂舉五祖和尚道四五百石麥二三千石稻好個𠇾粮方耆婆不得妙五祖老人等閒拈出無上命世真丹拋向諸人面前一任橫吞竪嚥可以起死回生可以轉凡成聖若不具人天眼目直是無下口處何故明明百草頭邊事不比楊岐栗棘蓬祖忌拈香對梁王廓然無聖此地無金二兩坐少林九年面壁俗人沽酒三升無影樹花敷五葉無烟火焰續千燈太平本是將軍建不許將軍見太平上堂舉教中道假使滿世間皆如舍利弗盡思共度量亦復不能知師驀拈拄杖云釋迦老子與天帝釋向中庭裏相爭佛法甚閙各與二十拄杖貶向二鐵圍山卓拄杖云好把一枝無孔笛夜深吹過汨羅灣因雪上堂僧問雪覆千山為甚麼孤峯不白師云別是一乾坤進云九天垂瑞雪萬國盡懽心師云片片不落別處僧禮拜師拈拄杖卓一卓云乾坤大地一時粉碎了也十方諸佛六代祖師天下老和尚直得瓦解冰消獨有普賢菩薩具大神力見大神變歡喜踴躍喃喃說偈云雪子落紛紛烏盆變白盆忽然日頭出依舊是烏盆忽有個漢出來道長老長老此是雪詩衲僧分上合作麼生只向道三冬多瑞雪鼓腹樂堯年涅槃上堂眾生畢竟無生死諸佛何曾有涅槃一把柳絲收不得和烟搭在玉欄干上堂僧問擬心即差動念即乖不擬不動還有過也無師云有進云畢竟如何則是師云莫認自己清淨法身乃云時節不相饒又逢三月旦拈却佛祖機與君通一線棕櫚葉散夜叉頭芍藥花開菩薩面上堂舉德山和尚因僧問從上諸聖以何法示人山云我宗無語句亦無一法與人雪峯從此有省有問雪峯和尚見德山得箇什麼便休去峯云我當時空手去空手回東山演祖拈云白雲今日說向透未過者有兩個人從東京來問他道甚處來他却道蘇州來便問伊蘇州事如何他道一切尋常雖然如是瞞白雲不過何故只為語音不同畢竟如何蘇州菱邵伯藕師云老東山可謂長於譬喻詞不迫切雖然如是要且只說得德山雪峯影子邊事若是齊眉共矚並駕齊驅未敢相許何故閩蜀同風肚裏有蟲結夏上堂護生須是殺殺盡始安居是真實語是不誑語喝差之毫𨤲謬以千里上堂頋左右云彼自無瘡勿傷之也歸堂喫茶去上堂臨濟喫六十拄杖高安灘上知歸興化於大覺棒頭深明黃檗意旨這般說話諸方喚作殘羮餿飯然羮藜含糗者難與道太牢之滋味是汝諸人合作麼生不覺秋深夜又長重陽上堂舉真淨和尚云九日無白醪飽餐黃栗糕十日有黃菊催人打禾糓五更鐘未鳴隣雞已數聲相逢不下馬各自奔前程師云逸格風流通身文采老雲菴美則美矣若約衲僧分上猶欠勦絕在山僧効顰亦有一偈舉似大眾非圖邁古超今且要應時應節九日無白醪萸茶滿椀澆十日有黃菊凉飈動林麓五更鐘未鳴過鴈兩三聲更欲求玄旨迢迢十萬程上堂金佛不度爐木佛不度火泥佛不度水真佛屋裏坐趙州眼光爍破四天下未免錯認驢鞍槁作阿爺下頷畢竟如何覓佛不見佛討祖不見祖甜瓜徹蒂甜苦瓠連根苦上堂譬如牛過窓櫺頭角四蹄都過了唯有尾巴過不得且道誵訛在甚麼處良久虎咬大蟲蛇吞鱉鼻上堂舉趙州和尚道老僧除二時上堂粥飯是雜用心處師云趙州有年無德錯下名言燒香禮拜是雜用心看經講教是雜用心參禪學道是雜用心了生達死是雜用心成佛作祖是雜用心唯二時上堂粥飯是善用心何也不曾咬破一粒米上堂僧問如何是毗盧師師云斷跟草鞋進云如何是法身主師云尖簷席帽進云學人不會師云見成行貨有什麼不會僧擬議師便喝乃云春雨如膏春風如刀春光似箭斷不相饒卓拄杖龍峯拄杖無遷變又見鵝黃上柳條上堂知見立知即無明本知見無見斯即涅槃無明涅槃是一是二一夜落花雨滿城流水香上堂十五日已前覔甚文殊普賢十五日已後釋迦老子不知有正當十五日天上無彌勒地下無彌勒時有僧躍出問天上無彌勒地下無彌勒未審誰與安名師云我行荒草裏汝又入深村解夏上堂四月十五日結却布袋頭十字縱橫底有甚數七月十五日解却布袋頭無繩自縛底有甚數喝結也不可得解亦何曾有解結二圓離面南看北斗下座上堂僧問至道無難唯嫌揀擇不揀擇時如何師云遇飯即飯遇茶即茶僧禮拜師云放汝三十棒乃云纔逢解夏又見中秋看看白盡少年頭驀拈拄杖旋嵐偃嶽而常靜江河競注而不流野馬飄鼓而不動日月歷天而不周卓拄杖有時乘好月不覺過滄洲
