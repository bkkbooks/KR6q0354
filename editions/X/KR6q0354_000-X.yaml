front:
  text: 徑山和尚愚菴禪師四會語序或問於濂曰世間至大者何物也曰天與地也曰至明者又何物也曰日與月也曰然則佛法亦明且大也其與天地日月齊乎曰非然也曰其義何居曰天地日月寓乎形者也形則有成壞有限量雖百億妙高山中涵百億兩曜百億四天下以至于恒河沙數皆有窮也皆有止也此無他囿乎形者也若如來大法則不然既無形體又無方所吾不為成孰能為之壞吾不為後孰能為之先吾不為下孰能為之上芒乎忽乎曠乎漠乎微妙而圓通乎其大無外其小無內真如獨露無非道者所以超乎天地之外出乎日月之上大而至於不可象斯為大矣明而至於不可名斯為明矣是故以有情言之則四聖以至六凡或迷或覺佛法無乎不具也以無情言之則水火土石與彼草木或洪或纖佛法無乎不在也三乘十二分教不能盡宣也八萬四千塵勞門不能染汙也嗚呼假須彌山以為筆香水海以為墨書之以不可說不可說阿僧祇數劫其能盡贊頌之美乎然而佛法固明且大也其靈明之在人也萬劫雖遠不離當念一念不立即躋覺地亦在夫自勉之而已濂雖不敏每遇學佛者喜談而樂道之初不以其證入淺深而有間其意頗有見於斯也徑山住持愚菴禪師得法於元叟端心四據名籃敷揚佛法以聳人天龍鬼之聽緇素相從如雲歸岫其弟子觀通等會稡成書介吾友用堂楩公來徵文以題其首濂懸燈而孰讀之其解人膠纏如鷹脫絛鏇摩雲而奮飛也其方便為人如慈母愛子一步而三頋也其全機大用如大將臨陳旗鼓動而矢石集也誠一代之宗師而有德有言者歟雖然不二門中一法不立何況於言覽者當求禪師言外之意使意見兩忘而忘忘亦忘方近道矣嗚呼佛法超乎天地之外出乎日月之上豈細故哉人患不求之爾今極其贊頌而書于此錄之端實欲起人之敬信也繪畫虗空非愚則惑濂盖無以遠其責矣洪武八年二月二十一日翰林侍講學士中順大夫知制誥同脩國史兼太子贊善大夫金華宋濂序愚菴及禪師語錄總目第一卷隆教禪寺語錄三十條第二卷普慈禪寺語錄三十九條第三卷杭州淨慈報恩禪寺語錄三十四條第四卷徑山興聖萬壽禪寺語錄一十一條第五卷再住徑山興聖萬壽禪寺語錄五十九條第六卷小參一十三條第七卷頌古五十五首讚語三十五首第八卷偈頌三十三首長短句第九卷偈頌一百七首五七言第十卷自題五首書䟦十二首附塔銘宋濂撰愚菴及禪師語錄總目終
