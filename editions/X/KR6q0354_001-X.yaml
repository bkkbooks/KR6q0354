body:
  text: 初住慶元路隆教禪寺語錄門人觀通等編師於至正壬午十月十日承行宣政院疏請入寺指山門云峯巒海湧樓閣天開是處是彌勒無門無善財祖堂祖祖相傳佛佛授手日午打三更面南看北斗據室頋左右云這裏無密室傳授底法諸人簇簇上來討個什麼拍禪床便起陞座拈香云此香天地萬物同體同根至尊至大本支百世無壞無雜彌高彌堅虔爇寶鑪端為祝延今上皇帝聖躬萬歲萬歲萬萬歲陛下欽願山如礪河如帶丕萬世太平之基車同軌書同文廓四海無為之化次拈香云三世諸佛無傳授歷代祖師無傳授天下老和尚無傳授隆教今日此香爇向鑪中供養前住杭州路徑山興聖萬壽禪寺第四十八代慧文正辯佛日普照禪師元叟端和尚諸人且道畢竟為個甚麼以香扣鑪三下便燒遂就坐吉祥和尚白椎罷僧問釋迦不出世達磨不西來佛法徧天下談玄口不開和尚今日出世畢竟為什麼邊事師云蛇無頭不行進云既是釋迦不出世為甚四十九年說師云法久成弊進云達磨不西來爭奈少林有妙訣師云年老成魔進云佛法天下徧不徧談玄之口開不開則不問和尚為國開堂皇恩佛恩憑何報答師云有眼者見有耳者聞僧禮拜師乃云海日高明海天空闊峯巒海湧樓閣天開頭頭無上妙門在在金剛正體諸佛出世以訛傳訛祖師西來將錯就錯一大藏教誑閭閻明眼衲僧自救不了但能無心於事無事於心便見堯風蕩蕩舜日熈熈天清地寧民康物阜山僧道薄人微遠承院命三江九堰航海梯山為國開堂舉揚宗旨無一絲毫瞞諸人諸人亦無一絲毫瞞山僧冀各存誠共相委悉復舉僧問百丈如何是奇特事丈云獨坐大雄峯僧禮拜丈便打師云大小百丈只解無佛處稱尊今日忽有問新隆教如何是奇特事只對他道汝等皆當作佛他若禮拜更向道但辦肯心必不相賺上堂即心即佛兔馬有角非心非佛牛羊無角會麼功德天黑暗女有智主人二俱不受下座上堂師召大眾眾皆仰眎師云子過新羅便下座上堂舉臨濟道一人論劫在途中不離家舍一人論劫在家舍不離途中那箇合受人天供養臨濟見處徧枯果然只具一隻眼山僧昨抵昌國訪諸官寮從東過西從西過東波波挈挈竟日只在途中且如何說個不離家舍此日歸來山門頭合掌佛殿裏燒香穿僧堂入厨庫總是自家屋舍又如何說個不離途中衲僧家只要據實而論若不據實而論謂之脫空謾語漢爭受人天供養隆教與麼告報也是小脫空且平實一句作麼生道乃云從來不唱脫空謌把火燒山拾田螺白格樹頭魚扇子急水灘頭鳥作窠好大哥以拂子擊禪床下座寶陀古鼎和尚至上堂僧問興化見同參打下法堂意旨如何師云有甚共語處進云高亭訪德山隔江見剎竿便回去又作麼生師云蟻子不食鐵進云寶陀和尚今日入山相看和尚如何施設師云相逢自有知音知何必清風動天地僧禮拜師云敗將不斬乃舉龍牙道雲居師兄得第二句我得第一句師云大小龍牙只和開張大口不覺舌頭拖地山僧茲承寶陀法兄和尚曲勞象駕枉賁空山但愧荒疎無伸供養豈敢妄通消息觀音菩薩將錢買糊餅放下手却是饅頭是第二句且如何是第一句喝一喝下座上堂彌勒真彌勒分身千百億時時示時人時人皆不識慈氏如來三百六十骨節八萬四千毛竅一時撒向諸人懷裏了也敢問諸人還識得也未若也識得天上無彌勒地下無彌勒卓拄杖此時若不究根源直待當來問彌勒上堂僧問語是謗默是誑語默向上有事在如何是向上事師云胡孫上樹尾連顛進云向上一路千聖不傳向上一路千聖不然畢竟如何則是師云向上一路只在目前乃云冬至月頭賣被買牛冬至月尾賣牛買被期三百六旬有六日以閏月定四時成歲移易一絲毫不得東頭賣貴西頭賣賤三十年後破草鞋向甚處著上堂寒暑迭相催今朝臘月旦滴水一滴凍莫道且緩緩便下座上堂舉玄沙因光侍者道師叔若參得禪小姪當打鐵船下海去沙住後令人持書問光去打得鐵船也未光無對後汾陽昭代云只見錐頭利不見鑿頭方玄覺云玄沙也是貧兒思舊債師云大小玄沙光侍者人我未忘互揚家醜千載之下遭人點撿翠屏終不學他古人一切只是如常昨承靈隱天童侍者相訪寒溫纔罷燒香喫茶茶罷送歸客位自然主賓道合叔姪情忘今日陞堂略此敘陳伏希道照佛成道上堂舉趙州問南泉如何是道泉云平常心是道州云還假趣向否泉云擬向即乖州云不擬爭知是道泉云道不屬知不屬不知知是妄覺不知是無記若真達不疑之道廓然蕩豁如太虗空豈可強是非耶師云王老師過犯彌天將釋迦世尊六年雪山千苦萬辛所得無上大道等閒花擘殆盡合與二十拄杖當時趙州眼光爍破四天下面被熱瞞則且置今日眾中莫有為世尊本底麼如無隆教不是為它閒事長無明忝為遺教遠孫未免出隻手去也拽拄杖下座一時趂散真泯二上座火真如淨境界一泯未甞存能隨染淨緣遂成十法界擲火云泥揑金剛水底走筆描菩薩火中行上堂舉東山演祖示眾云祖師說不著佛眼看不見四面老婆心為君通一線便下座師云若教頻下泪滄海也須乾上堂僧問不與萬法為侶者是甚麼人師云十字街頭石敢當僧擬再問師云又要第二杓惡水在乃云時維三月節屆清明不寒不暖半陰半晴落花啼鳥一聲聲驀拈拄杖穿却解空鼻孔𭣟瞎達磨眼睛踏破草鞋赤脚走好山猶在最高層師一日盥手次僧問如何是祖師西來意師以水洒之僧便走師喚來來古人水潑梃逐不去汝因甚便走僧却以手作洒水勢師云汝作道理會也僧便喝師亦喝僧復喝師便打僧云和尚莫錯打某甲師云汝但喫棒我要者話行上堂舉古者道色聲為無生之鴆毒受想是至人之坑穽又道直須向聲色裏睡眠聲色裏坐臥擊拂子喚作聲得麼竪拂子喚作色得麼離却分別心識意慶言句外道將一句來佛誕上堂良久云釋迦老子生也蝦蟆蚯蚓同證法身露柱燈籠共相慶賀雲門大師道我當時若見一棒打殺與狗子喫成人者少敗人者多擊拂子下座上堂水母吕鰕瑣𤥐腹蟹眼在鼻上脚在肚下下座元太初藏主至上堂舉阿難尊者問大迦葉云世尊傳金襴外別傳何物迦葉召阿難阿難應諾迦葉云倒却門前剎竿著師云阿難如是問迦葉如是答且道世尊當時有所傳耶無所傳耶這裏著得隻眼一大藏教五千四十八卷半滿偏圓權實空有無不透頂透底拈拄杖卓一下打還他周土麥唱歌須是帝鄉人上堂頋大眾云老僧已為諸人和盤托出了也飢逢王饍不能飡莫錯恠人好便下座上堂僧問馬祖陞堂百丈卷席意旨如何師云不是苦心人不知進云龍袖拂開全體現象王行處絕狐踪還得相應也未師云萬里望崖州乃舉洞山道五臺山上雲蒸飯佛殿堦前狗尿天剎竿頭上煎䭔子三箇胡孫夜播錢石霜道風吹石臼爭哮吼泥揑金剛水底走踏翻海月亂波生驚起土星犯南斗道吾道三面狸奴脚踏月兩頭白牯手拏烟戴冠碧兔立庭栢脫殻烏龜飛上天保寧勇和尚云此三頌一頌堪為佛祖為師一頌堪作人天榜樣一頌堪驗衲僧眼目具眼者辨取師云保寧與麼道奴見婢殷勤翠屏不惜眉毛與諸人說破字經三寫烏焉成馬解制謝都寺辦齋藏主秉拂上堂咬破鐵餕餡百味具足演出大藏教一句該通三脚驢子弄蹄行萬里無寸草下座秋日示眾叨據名藍海上州慚無道福繼芳猷宗綱委地方堪憫聖德如天未易酬好把靈符縣肘後莫將閒事涴心頭金風昨夜飄梧葉地北天南又早秋師一日入園見典座割瓜師問刈得幾个祖師頭座云三十個師云那個皮下有血座云和尚何得重重相戲師云好心不得好報八月旦開堂請監收并謝雨上堂今朝八月初一天外雲收日出夜來灌門龍王見大神變降注大雨盡大地草木叢林稻禾菽粟皆得霑濟隆教寺裏普請監收個個得人一年三百六十日管取粥足飯足江南兩浙春寒秋熱下座育王石堂和尚遺書至并入祖堂上堂五十三年弄巧成拙踏破虗空赤脚行萬象森羅咲不徹大眾個是育王石室和尚末後為人底句子明如杲日寬若太虗權實照用俱備擒縱殺活皆全可以津濟四生可以梯航九有蚊子上鐵牛無你插觜處卓拄杖這裏見得無一處不睹慈容無一時不聞說法苟或未然少間下座普請諷經莊嚴品位香烟起處一任觀瞻師到千𥗽莊眾請觀海次師問大海不宿死尸魚以水為命因甚死在海中代云怕爛却那又云性海無風金波自湧忽遇旋嵐偃嶽時如何代云湛湛地回至莊中喫茶次師云邪心是海水煩惱是波浪毒害是惡龍塵勞是魚鱉諸人日用現行作麼生免得有僧拈茶缾師前傾茶便行師云正是亂瀉僧回頋師便喝出九日上堂僧問如何是賓中賓師云君向瀟湘我向秦進云如何是賓中主師云常在途中不離家舍進云如何是主中賓師云常在家舍不離途中進云如何是主中主師云橫按鏌耶全正令太平寰宇斬癡頑進云賓主已蒙師指示向上宗乘事若何師云三年一閏九日重陽復舉大茅示眾云欲識諸佛心但向眾生心行中識取欲識常住不遷義但向萬物凋落處會取師云古人言不虗發發必全真眾生現行無明煩惱業識茫茫作麼生說個諸佛心秋變冬凋春生夏長萬物榮謝無有停息又如何說個不遷義三玄三要事難分得意忘言道易親一句明明該萬象重陽九日菊花新拍禪床云汾陽和尚來也切忌錯下註脚上堂頋左右云千年田八百主郎當屋舍沒人修火官頭上風車子咄上堂二月仲春漸暄村村花柳爭妍唯有衲僧拄杖長時無變無遷卓拄杖云上乘菩薩信無疑中下聞之必生恠
