body:
  text: 偈頌門人慧鏡等編寄大慈學古庭講主時無量壽院四十行人同聲華嚴古庭主席稽首華嚴大法王萬行因華嚴果德破一微塵出大經大慈法力難思議諦觀法界諸有情如來智慧悉圓滿妄想執著成倒迷如大經卷藏一塵種種譬喻廣演說方便善巧力開示誓令小大咸悟入同入毗盧華藏海毗盧藏海無有邊功德勝妙亦無量體用全彰大方廣實無名相而可得八萬四千諸法門由茲建立所分別一法若有墮凡夫萬法若無失真境法王稱性熾然說終始未嘗談一字法身大士四十位聞所聞盡曾不聞方當聞說寂滅時徹證華嚴真法界乃知出息與入息常轉如是大經卷異口一音僉讀誦一即是多多即一徑山說偈徒贊歎大慈法力讚莫及善哉無量壽道場金碧莊嚴勝無比阿蘭若法菩提場睹史夜摩靡差別七處九會即如今一念三世悉平等前佛後佛等一佛前身後身同一身稽首法王世希有如佛出世普饒益願言世主千萬壽金輪法輪永同轉住行向地諸上人世出世間同法會過海羅漢圖因如海請題次韻十八高人學無學伎倆通身用不著鉢盂安柄舀虗空拄杖和雲挑華嶽天生三毒牢不遷往往對面森戈鋋看讀豈識白繖蓋默照參得黃楊禪娑竭羅宮頻出入大龍相招小龍揖只貪龍頷得明珠不知裙子褊衫濕赤脚踏葦如徒杠袖手浮杯穩勝航波神鮫女設供具差珍異寶爭妍䊋到此急須登彼岸主人翁也勤勤喚弄潮輸與弄潮人豈容名字阿羅漢了得心身本性空隨波逐浪皆超宗斫脛未遭黃宗運誰識瞿曇那一通白晝晴窓開玉軸一笑東風生意足天台鴈宕幾時歸萬壑春雷吼飛瀑瞎牛歌贈韓公望公望儒醫中年目眚自號瞎牛隔垣見肝膽自號為瞎牛我歌瞎牛歌萬象笑點頭瞎牛兒人莫識曠大劫來無等匹異類中行得自由眼處聞聲耳觀色瞎牛兒世希有金毛師子喚作狗祖父田園任力畊異苗靈藥時翻茂瞎牛兒無煩惱誰管青黃赤白皁一犂新雨隴頭春數聲長笛江村曉瞎牛兒真快活脚頭脚尾乾坤闊鼻孔撩天不著穿生死無明俱透脫瞎牛瞎牛聽我歌六根互用無徧頗眾生洞眎只分寸大千剎海菴摩羅應菴和尚送密菴遺偈蔣山請和潦倒蘄州子無門為法門憐兒不覺醜遺墨尚留痕披卷光零亂搖乾復蕩坤縣知揮洒日硯沼雨翻盆毒藥醍醐句當機斷命根密菴曾落賺鍾阜莫欽遵次空室韻贈中竺傑侍者爾家有祖薤室翁天南地北趨玄風豈但宗通說亦通肆口說法諸法空下視碌碌皆兒童妙圓不涉空假中二三四七將無同聲動𦦨摩覩史宮鴻鐘鏗鍧鼓鼕𪔴冢嗣傑出千人叢等觀萬物垂慈瞳鄮峯靈塔慈雲籠佛智燈連廣智公天曆聖代親遭逢如佛出世福慧充中天調御天人雄利生悲願無有終慣用熱鐵并洋銅玄沙釣魚在孤篷石鞏生涯唯一弓弄大旗鼓若總戎懷哉嬾菴心為㤝愛爾入室朱顏紅浩氣橫空猶螮蝀飽參華夏聲譽隆扶桑歸計休忩忩千鈞大法在爾躬老我聞見如盲聾示七閩鼎禪者叢林秋晚時祖脈絲縣鼎學佛要明心參禪須見性心空性即空頭正尾亦正拗折石鞏一張弓拈出玄沙三種病示嚴州用禪者但能善用其心則獲勝妙功德乃先聖之格言貴當人之不惑展開七尺單竪起生鐵脊脚下如臨萬仞坑腕頭何翅千鈞力前無釋迦後無彌勒昨夜桐江水逆流釣臺浸爛嚴光石次中竺韻送元藏主兼柬楚石和尚縱橫筆陣元和脚寫出威音前一著權實昭彰理事全佛祖讓雄甘小却平地驚翻千歲巖煒煒煌煌尤赫赫老子全施格外機不比尋常黑豆法藏主道韻熈春陽況是年華方盛強少室門風苦寥落要須努力揚餘光黃檗何孤打臨濟雲門底事師曾郎叢玉軒中喜相見十里平湖開鏡面深愧疎慵日應酬攪得身心一團線先師未了舊公案眼底憑誰為批判寄語秦川楚石翁老驥騰驤當血汗彌首座還嘉禾兼柬南堂天寧三塔興聖資聖顧玉山諸老黃梅雨歇江天凉薰風南來白晝長閒房古寺不肯住却憶并州是故鄉臨行袖紙索長偈信筆莫嫌無好句法弱魔強正此時濟北頹綱合扶起只今四海惟南堂佛病祖病排膏肓有若長庚配殘月清光爛熳天一方更愛南湖第一剎瓦礫縱橫熾然說璚樓玉殿現毫端不費腕頭些子力龍囦直下深無底浩浩松源有源委不比尋常藥汞銀真成師子一滴乳虹渚風煙接爽溪伯吹壎兮仲吹箎放開佛手展驢脚縱橫妙用皆全提一笑三生淨名老聞道全身入荒草勘破諸方老古錐奪市攙行非小小醉李亭前好歸去一一相逢煩道意千里同風不用論也知首座多長處盈藏主歸淮南日月盈辰宿列張江河流注山巖崢嶸頭頭普示物物全彰子也親曾入吾室有口只堪高挂壁本無一法可流傳拈花微笑成狼藉一氣轉一大藏教萬象森羅俱絕倒直得長淮水逆流凌霄峰頭日杲杲袖紙殷勤索贈言大似撥火求淵泉丈夫胸中有天地止啼黃葉非金錢次西齋韻贈定藏主如來四十九年說偏圓半滿無空闕始終一字不曾談無端重把牢關泄道人秉志事參方勇猛精進光明幢信手揭飜華藏海樹頭驚起魚雙雙直得虗空失笑萬象拱立又誰管你無位真人常在面門出入君不見老趙州眼無筋大王來不起身有問萬法歸一一歸何處却道我在青州做一領布衫重七斤次韻贈福藏主無上兩足尊福足慧亦足法門廣闢度羣生六六依然三十六大藏教兮一絡索子細看來特地錯嘉州大象驀翻身陝府鐵牛攧折角子是龍河英俊流何勞向外空馳求五千餘卷瘡疣紙十聖三賢茅溷籌無本據有來由禾山只解打鼓雪峯一味輥毬休休春光似酒春雨如油隨緣放曠任運優游盡說洛陽花似錦不知春在柳梢頭次西齋韻贈真藏主道人學道如香象截流渡河真勇猛馬駒踏殺天下人一喝耳聾惟百丈古今不隕一絲毫力行古道毋辭勞一氣轉一大藏教銷得黃金北斗高誰言祖諱休輕觸五逆兒孫無面目如何是佛麻三斤直下分三要成六示福建常禪人天不能蓋地不能載豈常人之所能荷擔大小祖師問著但道不識不會航海梯山千里萬里東討西尋不是不是著衣喫飯時屙屎送尿處如形影之相隨求人不若求己君不見玄沙備不出嶺來多意氣踢破娘生脚指頭百世光明照寰宇次韻贈秀北宗藏主面南看北斗火裏蘆花秀一句三玄濟北宗拈來塞斷衲僧口大藏與小藏雙収復雙放大洋海底袞沒馬之紅塵須彌峯頭鼓滔天之白浪潦倒徑山慚無伎倆謾贈短謌敲空作響羅龍打鳳羨龍河龜毛結網三千丈示寶陀春藏主泗州大聖受業寶陀巖上觀音泗州城裏大聖神通妙用縱橫總是冬行春令德山入門便棒臨濟入門便喝知之者謂之喜捨慈悲不知者喚作尋常孟八道人諮參徧寰宇抉珠直入滄溟底眼頭蒼翠既分明脚下淺深還自委示脩藏主祖師巴鼻莫辨金沙空中結紐石上栽花一大藏教對一說拄地撐天繫驢橛掣斷金鎖天麒麟等閒挨落天邊月會則事同一家不會千差萬別那吒頂上喫蒺藜金剛脚下流出血格首座歸日本次韻是不是非不非肩橫七尺烏藤枝從來首座有長處脚未跨門吾已知不用說心說性何須象席打令問訊燒香喫茶分明如鏡照鏡昨夜文殊普賢起佛見法見貶向二鐵圍山休論夢昇兜率劒挂眉間飜身靠倒扶桑國南海波斯念八還恩禪人參方恩禪欲參方袖卷索長偈更不涉思惟分明為君舉閩越山萬重江淮水千里縱橫拄杖頭總是自家底有佛處不得住何妨小小盤桓無佛處急走過正好遲遲遊戲遇飯即飯遇茶即茶可行即行可止即止草鞋踏破早歸來莫待秋風撼庭樹示淨心禪人心淨則佛土淨剎剎塵塵大圓鏡心空則諸法空昨夜南山虎咬大蟲參禪只要明心地立雪神光曾斷臂覓心不得即安心達磨大師無本據我無一切心何用一切法心空及第好還家萬里北風吹觱發次韻示東林守禪人學道譬彼用兵善戰不如善守但知能言匪舌便解行拳非手何煩拋却東林遠參西麓病叟汝既單刀直入我即烏藤便摟棒頭拾得全身未許開張大口成禪人參淨覺學道本成見萬法唯心識頭頭見釋迦處處逢彌勒實學真參大丈夫釋迦彌勒是他奴鼻孔吸乾四大海眼睫倒挂須彌盧任性優游天界隨緣放曠皇都誌公豈是閒和尚達磨道地老臊胡一箇現十二面觀音問渠那個是正面一箇道廓然無聖第一義諦爭得無要須超越莫受塗糊淨覺國師機用別紫羅帳裏撒珍珠示傳無用用無用為無為作無作活袞袞明落落剛然索我無用之空言畫虵未免重添足無用老知不知用而無用為無為大洋海底紅塵飛用而無用作無作空裏磨盤生八角用而無用無亦無蟭螟吞却須彌盧便恁麼去未敢相許別有商量賣弄口觜無用老怎麼好不若從他要用便用生鐵團上休尋縫要為便為饑來喫飯寒著衣要作便作春至花開秋葉落須知執法修行正是無繩自縛君不見祖師道大用現前不存軌則桑條上著箭柳樹上出汁妙用恒沙有何極又不見傅大士曾有言空手把鋤頭步行騎水牛後夜雙溪弄明月看取橋流水不流新首座歸荊溪山居次印心韻大乘根器生神州冰枯雪老知幾秋碧明胡僧眼未識迢迢謾作真丹遊一言易出難翻款九年面壁嵩山畔殃及齊腰立雪人覓心不得忙如鑽道流問道來江東龍河萬衲如雲從眉間劍氣拂牛斗相逢政好論宗風五葉一花開朵朵達磨不曾傳慧可不見當年老藥山一物不為唯宴坐道流好歸松石室自在經行及坐臥有問西來事若何樓至拳頭如鉢大雪巖和尚牧牛歌慶禪人請和雪巖牧牛機不密溪東溪西露聲跡引得無知瞎屢生終日茫茫去尋覓何如長慶一牧三十年調伏功深有來歷或全放或全収縱橫自在無拘留閒鞭索舊犁杷嗄地一聲俱颺下從教日炙與風吹饑來喫飯寒著衣脚頭脚尾乾坤闊鼻孔撩天雙眼活三叉路口夕陽紅酒旗獵獵搖晴空短笛橫吹西復東落花飛絮春濛濛次韻送等藏主生佛本平等參方須見性眾生無相身諸佛無見頂光明徧剎塵晃晃相輝映是藏不是藏非心亦非境少減與多添曾不墮虧剩蛩吟秋夜長鳥啼春晝永明明絕覆藏歷歷亡偏正物我了真空順逆委天命法海浩無邊行行恣游泳堪嗟演若多迷頭徒認影震藏主歸吳兼柬萬壽行中法兄次全室韻七穿八穴毗盧藏不住十玄并六相五千餘卷錯流傳說性說心皆影響拈花微笑本無旨冷暖自知魚飲水二三四七謾相承上大人兮丘乙己我昔叨居慧日峯當場蹴踏多象龍子方年少擅英俊力探此道甞游從老我衰殘非舊日喜子龍河扣全室全室當今大法王為人只個龜毛拂頂門有眼分邪正塞却耳根休聽瑩凌滅宗風五逆兒佛祖天魔隨號令北山與我同心曲白紙不勞馳片幅為言早晚定南還相看糞火煨黃獨友禪人請藏經歸日本次韻善財南詢見初友拈得鼻孔失却口彈指豁開樓閣門震徧震兮吼徧吼益堂遠自扶桑來鯨濤直度無縈迴順風五日到中國喜見海山萬朵青崔嵬搆得藏典五千四十有八卷豈憚山長并水遠明朝別我又東還好把船頭輕撥轉須知大法本無傳樹林水鳥常敷宣石城山前重回首佛日照曜東南天虗室贈滿藏主次韻幻有不異真空虗妄不離真實有室胡為揭虗空此室無面無背與虗空而同大苟離實而即虗六戶皆成有礙室之寬無邊剎海俱包含室之窄纖毫長物難藏著寬窄虗實當頭坐斷不用論量十世古今一念現前了無縣隔此室非空亦非有要在當人善持守等閒和底盡掀翻噴嚏也成師子吼元禪人歸日東大唐國裏無佛法胸次莫留元字脚行脚參方合自知差病不假驢駝藥達磨老臊胡西來成大錯人人鼻孔撩天箇箇眼生三角直指人心心本空見性成佛佛乃覺春至自華開秋來還葉落踏破草鞋歸去來萬里海天飛一鶚示山居持首座堅持密行默照深禪執之失度放之自然端可以卷舒立方外乾坤縱橫挂域中日月說甚麼眉間挂劍血濺梵天君不見大梅一見馬師後拈得鼻孔失却口直入千峯與萬峯誰肯將身藏北斗又不見潦倒龍山住菴日入海泥牛絕消息不知塵世是何年但見日頭東畔出菴居識得菴中主狸奴倒上菩提樹不妨百鳥獻花來從教菜葉隨流去洞庭謠送嘉則堂住水月東洞庭西洞庭下瞰太湖三萬六千頃白波之浩渺上矗奇峯七十一二朵秀色之空青金剎星羅焯雲漢林屋路窅通滄溟盧公石屏凜生面尚想叱咤生風霆更憐慈受樂幽隱樹林水鳥共演妙法談真乘耀古輝今誇二老俯仰有誰同此道水月光中得異才善舞不妨場地小清淨之身廣長舌坐斷湖山熾然說水天無際月孤圓一切水月一月攝楊岐乍住空四壁辛苦栽田博飯喫風穴單丁儼千眾百世高風動寥泬復先德之真規埽末流之塵跡插一莖草現璚樓玉殿未稱全提布縵天網打衝浪錦鱗不勞餘力流芳天瑞挺孫枝臨濟未是白拈賊古鏡贈明禪人混沌未分世界未立一片靈光湛而常寂靜鑑萬象洞照十虗交徹融攝無欠無餘胡來漢來日面月面見見之時見非是見爾稱古鏡當究厥旨耀古騰今輝天鑑地湛源贈定禪人真源湛寂撓之則昏靜以照之鏡而不痕儵然情波忽焉識浪流轉三界千態萬狀咨爾定力五濁俱捐塵塵清淨剎剎澄圓已上皆長短句
