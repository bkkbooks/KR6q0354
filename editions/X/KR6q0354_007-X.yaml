  - {type: 其他, offset: 1500, content: 僧問興化四方八面來時如何化云打中間底僧便禮拜化云昨日赴箇村齋回來中路撞著一陣卒風暴雨却向古廟子裏閃避得過, id: KR6q0354_X_007-mulu-40, level: '2'}
  - {type: 其他, offset: 1608, content: 夾山示眾云目前無法意在目前不是目前法非耳目之所到, id: KR6q0354_X_007-mulu-41, level: '2'}
