  - {type: 其他, offset: 759, content: 無業國師云若一毫頭凡聖情念未盡不免入驢胎馬腹裏去白雲端和尚云設使一毫頭凡聖情念淨盡亦未免入驢胎馬腹裏去, id: KR6q0354_X_007-mulu-23, level: '2'}
