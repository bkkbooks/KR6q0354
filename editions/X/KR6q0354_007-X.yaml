body:
  text: 頌古門人寶盈等編世尊初生謾歷僧祇曠劫修禍胎又復降閻浮至今醜惡難遮掩突出雲門拄杖頭外道問佛皓月當空似鑑圓塵毛剎海照無偏迷雲散盡搏桑曉桂殿嫦娥怨未眠女子出定出得出不得商量徒苦辛千年桃核裏覓甚舊時人殃崛摩羅持鉢瞿曇具正徧知尊者豈無三昧母子兩得分解非干別人之事賓國王斬師子尊者利劍斬春風虗空展笑容未明三八九宿對一重重達磨面壁九年面壁訪知音畢竟同誰話此心三拜起來依位立丈夫膝下有黃金廬陵米價廬陵米作麼價此語流傳遍天下佛法大意這只是衲僧不用生疑怪石頭云恁麼也不得不恁麼也不得恁麼不恁麼總不得諸佛心要列祖玄關至簡至易難之又難馬祖三十年不少鹽醬自從胡亂後不曾少鹽醬有甚閒消息寄與讓和尚龐居士問馬大師不與萬法為侶者是什麼人大師云待汝一口吸盡西江水即向汝道一口吸盡西江水識浪情波徹底乾截斷老龐三寸舌倚天長劍逼人寒百丈再參馬祖當機一喝怒如雷誰道精金色不回直得耳聾并吐舌三玄戈甲火中栽國師三喚侍者國師徹底老婆心侍者真鍮不博金奇語傍花隨柳客養兒方識父恩深南泉心不是佛智不是道心不是佛智不是道夜雨滴空階春風吹百草本無迷悟人只要今日了南泉平常心是道平常心是道親切為君宣瞥爾情生也何由脫蓋纏趙州訪臨濟西來祖意觸處分明趙州洗脚臨濟側聆趙州訪茱萸曹溪正脈古猶今拄杖如何探淺深莫道茱萸無一滴趙州直下被平沈趙州勘婆善舞太阿劍決無傷手戹慣編猛虎須必有全身䇿勘破臺山臭老婆打失當頭箇一著趙州有佛處不得住無柰雪霜寒怕見楊花落打破趙州關清風滿寥廓趙州狗子無佛性趙州狗子無佛性三世如來不見蹤昨夜含暉亭上望青山倒景月明中趙州問南泉知有底人向什麼處去泉云山前檀越家作一頭水牯牛去州云謝師答話泉云昨夜三更月到窻水牯水牯皮好鞔鼓角好吹嗚哩嗚昨夜三更月到窓天上日輪正卓午青州布衫萬法歸一一歸何處寧可截舌不犯國諱青州布衫重七斤千手大悲提不起提得起也大奇等閒掛向肩頭上大勝時人著錦衣無業國師云若一毫頭凡聖情念未盡不免入驢胎馬腹裏去白雲端和尚云設使一毫頭凡聖情念淨盡亦未免入驢胎馬腹裏去佛祖位中無住著人天路上絕躋扳驢胎馬腹埋頭入一片閑雲任往還鎮州蘿蔔鎮州出大蘿蔔趙州親見南泉五祖栽松道者洞賓元是神仙臨濟見僧入門便喝入門便喝是何宗旨明眼人前一場笑具德山見僧入門便棒入門便棒是甚機用趁得老鼠打破油甕三聖逢人則出出則不為人興化逢人則不出出則便為人張公賣醋李公賣鹽道路各別養家一般臨濟兩堂首座齊下喝兩堂喝下主賓分點鐵成金豈易論父子不傳真妙訣嘉聲千古振乾坤德山托鉢鐘未響兮鼓未鳴德山托鉢下堂去雪嶠連忙喚得回巖頭密啟深深意不了目前機寧論末後句果然遷化恰三年疑殺禪和萬萬千洞山云言無展事語不投機承言者喪滯句者迷解唱非關舌能言不是聲干戈才偃息四海樂清平雪峯望州亭相見鵝湖歸方丈保福入僧堂望州烏石嶺何處覓曾郎玄沙見新到才禮拜沙云因我得禮你目前無闍梨座上無老僧因我得禮你錯認定盤星玄沙三種病人釣魚船上謝三郎攪得江湖沸似湯撿點衲僧三種病不知自病入膏肓玄沙云若論此事喻似一片田地四至界分結契賣與諸人了也只有中心樹子猶屬老僧在祖翁田地中心樹拄地撐天價莫論賣與買人誰是主清陰留取覆兒孫靈雲見桃花武陵源上東風裏款乃歌聲逐流水回首仙踪不可尋桃花亂落如紅雨明招虎生七子無尾菸菟氣食牛是誰全放復全收李將軍有嘉聲在射著元來是石頭普化明頭來明頭打普化搖鈴鐸曾郎輥木毬虗空放紙線斷一時休興化打克賓大覺堂前遭痛棒衲衣卸下急翻身分明有理難伸訴法戰場中打克賓興化上堂云今日不用如何若何便請單刀直入興化與你證據時有旻德長老出眾禮拜起來便喝化亦喝德又喝化又喝德禮拜歸眾化云適來若是別人三十棒一棒也較不得何故為他旻德會一喝不作一喝用龍驤虎驟電激雷奔一挨一拶搖乾蕩坤冰稜上度過九鞠劍刃上拾得全身選佛若無如是眼宗風那得到于今僧問興化四方八面來時如何化云打中間底僧便禮拜化云昨日赴箇村齋回來中路撞著一陣卒風暴雨却向古廟子裏閃避得過閙處靜峭峭靜處閙浩浩古廟裏藏身咄哉興化老風吹不入雨打不濕四方八面絕遮攔中間猶隔萬重山好把一枝無孔笛夜深吹過汨羅灣夾山示眾云目前無法意在目前不是目前法非耳目之所到直下會來猶未是才生分別轉誵訛休將支遁池中鶴喚作山陰道士鵞雲門須彌山雲門禪在口皮邊靈利師僧會轉難突出須彌橫海上從教日月自循環雲門大師云聞聲悟道見色明心作麼生是聞聲悟道見色明心乃云觀音菩薩將錢買胡餅放下手云元來却是饅頭吹盡風流大石調唱徹富貴黃鐘宮舞腰催拍月當曉更進蒲萄酒一鍾瑞巖喚主人公潦倒瑞巖無別法尋常但道惺惺著凡聖由來共一家誰是主人誰是客雲門示眾云世界恁麼廣闊為什麼鐘聲披七條聲來耳畔何須較耳到聲邊不用論披起七條全體現更於何處覓聞聞首山竹篦首山舉起竹篦衲子休分背觸喚作一物不中擬議橫屍露骨僧問乾峯十方薄伽梵一路涅槃門十方薄伽梵一路涅槃門華嶽連天秀黃河徹底渾芭蕉拄杖芭蕉拄杖子分明為君舉奪也未嘗奪與亦何曾與放在臥床頭急要打老鼠羅山送同行矩長老幾年湖海共參尋惜別如何話此心生鐵蒺藜當面擲三千里外有知音僧問風穴語默涉離微如何通不犯穴云常憶江南三月裏鷓鴣啼處百花香百花深處鷓鴣啼高下林巒錦繡圍滿目春山與春水笙歌叢裏醉扶歸汾陽十智同真千溪萬壑歸滄海八表三邊朝紫宸欲識汾州真面目重陽九日菊花新百丈野狐用盡自己心笑破它人口多遇野干鳴罕逢師子吼舉道者訪琅瑘打鼓弄琵琶相逢兩會家禪流爭指註杜撰數如麻楞嚴經云見見之時見非是見見猶離見見不能及開眼也著合眼也著黃面瞿曇錯下註脚楞伽經五法三自性二種無我法性本空不墮諸數虗空亦無何名為我百非四句盡掀飜家家門首長安路法華經云大通智勝佛十劫坐道場佛法不現前不得成佛道一念普觀無量劫饑來喫飯困來眠堂堂大道無今古佛法何曾不現前讚語門人至寶等編釋迦出山相明星瞥見便抽身鼻孔依前搭上唇殃及兒孫無了日直將北斗作南辰無量壽佛願輪赫日繞須彌垂手毋忘二六時住世壽元無有量度生悲智不思議光明遍照恒沙國福慧真成大導師地獄天宮皆淨土此心只許老胡知觀音大士惟我大士普現色身而此福聚示以童真一月在天影含眾水清淨寶目明照無二三界火宅均受熱惱手甘露枝永矢弗舍我願眾生得正三昧剎剎圓通塵塵自在手眼通身福慧無量修因證果上合觀音古佛本妙圓通拔苦與樂下與法界眾生同一悲仰無機不被有願必從如谷答響如風行空海岸乾坤自孤絕善財何處覓靈蹤從聞思修入三摩地以悲智願行平等慈度一切眾生實無眾生得滅度者具一切功德是真功德不可思議不是文殊輕漏泄圓通門戶許誰知突𩬆如雲淡梳洗無底籃盛赤梢鯉東頭賣賤西頭貴不愁世上無行市三級浪高魚化龍癡人猶戽野塘水聞所聞盡空所空滅將錢買胡餅放下却是鐵縣崖峭壁現自在身月在水中撈得上不將一法繫於人大士方便力微妙難思議而於一毫端示現文句身法界諸有情瞻禮仍讀誦言詞相寂滅現前獲圓通我願未來世修行不退轉具足智方便亦如光世音八萬四千母陀羅臂提接之悲豈唯四爾法身無相不墮諸數隨眾生心現一切處一即一切一切即一月印千江春行萬國我觀大士離分別見離性亦無日面月面平等垂慈道至公六根互用總圓通潮回浦面千波合春透花枝萬卉同悉使癡昏瞻慧日普令熱惱濯清風大悲空盡眾生界依舊扶桑在海東為日東禪人贊四不思議二殊勝兔角龜毛一串穿誰識普門真境界海天無際月孤圓跏趺草偃吉祥風玉臉吹香展笑紅一念普觀無量劫狸奴白牯證圓通蓮葉舟輕苦海深跏趺聽徹海潮音魚龍鰕蟹都成佛無限平人被陸沈娑婆教體在音聞聞復音銷道自尊未許文殊善甄別十方一路涅盤門池沼樹林皆演法山河國土共舒光眼聲耳色常三昧何啻心聞洞十方維摩居士神通妙用不思議大似空拳誑小兒試問針鋒持棗葉何如芥子納須彌觀身實相寧多病杜口無言只自欺堪笑靈山三萬眾望風碌碌樹降旗是病非地大亦不離地大咄哉老古錐開口成話墮不得文殊錯證明至今臥病毗耶城布袋和尚百億分身補處尊囊中別是一乾坤不知說法龍華會畢竟如何建化門達磨龍鳳之姿天日之表栖栖暗度江討甚閒煩惱三五回中毒宿債難逃八九年面壁邪禪默照裂髓分皮急轉身不覺全身入荒草胸中崖岸千尋險脚下波濤萬丈深十萬西來緣底事只應梁誌是知音東西走得脚皮穿教外何曾有別傳任尒一花開五葉好兒終不使爺錢羅漢修行未斷鼠毒法應供毋忘信施恩三界塵勞深似海與誰𢹂手涅槃門天台智者大師手把鐵如意作大師子吼一心本空寂三諦亦非有燈籠㳂壁上天台驚起法身藏北斗六世祖師漳南禪人請讚證不滅受達諸法空當朝觸諱有理難容一葦渡江九年面壁前無釋迦後無彌勒分皮擘髓大振玄風千峯到嶽萬派朝宗將心來安心無可覓三拜起來依位而立水不洗水金不博金雲開月現日照天臨積雪沒腰利刀斷臂仰止風規覺我形穢將罪來懺罪不可得證自覺智滅妄想惑囏難備甞不動本際命縣一絲燈聯三世毗盧心印銘示後昆黃河九曲水出崑崙脇不著蓆垂六十年三詔弗起雷動九天道傳嬾衲衣付小兒月臨眾水春透花枝一切諸法悉皆解脫最初一句末後一著老難授道去來奚難捨身受身濁港江邊圓滿德相具大總持千鈞大法七歲沙彌钁頭邊事不勞拈出雙峯峨峨青松佛性本空豈有南北一句當機青天白日菩提無樹明鏡非臺三更付法醉後添杯死款活供來時無口石上栽花空中結紐栽松道者破頭山裏栽松日濁港江邊寄宿時大法一絲縣九鼎去來心事許誰知李習之參藥山雲在青天水在瓶方知見面勝聞名回身失却來時路直向深深海底行船子和尚拋却蘭橈覆却舟錦鱗一躍過滄洲釣竿不用重栽竹千古朱涇水倒流永明智覺禪師以心為宗如鏡照鏡一塵不立羣機普應風吹波浪日照光明欲識玄旨翳汝眼睛心外無法鏡中無象我述讚詞敲空作響伏虎逢禪師朗瞻院裏村僧大寂室中逆子盜如來心骨舍利道地白地陞須彌三佛對談開眼寐語至若携大扇時時入城乞錢買肉馴猛虎帖帖無傷人之意護禁戒則神人嘗跪於前惜檀施不遺洗鉢盂水是皆行業之不可測者或外現而內秘小根魔子豈容擬議宜乎吳越國主特加禮敬節度使為之大敞其居敕名真際是謂猪頭和尚普覺大師永永真風之不墜者也行化騎虎小象普覺真身瘞五雲化風藉藉古猶今難教虎絕傷人意只要人無害虎心開元和尚方崖禪師大方無外大圓無內大坐匡床橫揮玉麈發大機於陽羨溪頭顯大用於闔閭城裏崖崩石裂電激雷奔手面縱橫綽有餘裕穿盡天下衲僧鼻孔不動根本自然之智澄江淨如練愛謝玄暉念話解識生緣綠陰生晝寂笑韋應物留題只作境會掀翻寂照門庭凌滅妙喜家世百巧僧繇邈未真九九元來八十二古鼎和尚定都管請贊這尊慈鐵奉化四坐道場眼空佛祖背觸竹篦顛倒握電掣雷訇縱橫栗棘渾侖吞神憎鬼怖據凌霄峰作師子吼一十一年言滿天下道滿天下名滿天下搖籃繩斷露全身大地山河無寸土
