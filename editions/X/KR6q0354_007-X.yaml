  - {type: 其他, offset: 634, content: 趙州問南泉知有底人向什麼處去泉云山前檀越家作一頭水牯牛去州云謝師答話泉云昨夜三更月到窻, id: KR6q0354_X_007-mulu-21, level: '2'}
