body:
  text: 再住徑山興聖萬壽禪寺語録門人希顏編師至正甲辰二月十九日復住徑山據方丈云釋迦掩室於摩竭癩馬繫枯樁淨名杜口於毗耶黑牛臥死水徑山終不學它古人畢竟如何卓拄杖釣竿斫盡重栽竹不計工程得便休院劄拈起劄云前佛性命後佛紀綱總在這裏凜然如朽索之馭六馬危乎猶一𩬊之引千鈞若非大丞相赤手提持全肩檐荷何處更有今日諸人還委悉麼車不橫推理無曲斷升座祝贊罷有僧出問云龍門岌岌倚天開妙喜今朝喜再來坐斷十萬全正令森羅萬象舞三臺正與麼時如何是祝聖一句師竪起拂子云萬歲萬歲萬萬歲進云妙喜道十方世界至人口法界所有即其舌只馮此口與舌頭祝吾君壽無間歇未審與和尚是同是別師云黃河如帶泰山如礪進云祝聖已聞玄妙語祖師心印若為論師云山上有鯉魚井底有逢塵進云此是開山國一祖師道底和尚畢竟如何指示師云井底有塳塵山上有鯉魚進云恁麼則今古應無墜分明在目前師云一任鑽龜打瓦又有僧出問云記得昔日江西馬祖嘗令西堂智藏馳書到當山國一禪師師開緘見一圓相索筆於圓相中點一點意旨如何師云不因闍梨問老僧亦不知進云後來南陽忠國師道欽師猶被馬師惑還端的也無師云也端的也不端的僧禮拜歸衆師乃云山僧隨緣受報濫此承乏坐嬰宿障誓欲投閒茲承監察御史太尉柱國丞相不忘靈山付囑協心削牘復任住持難為回避只得免循舊例升于此座虔爇寶香祝延今上皇帝聖壽萬安皇后齊年太子千秋文武官班同增祿算欽願皇圖永固帝道遐昌武偃文修河清海晏風調雨順物阜民康便恁麼散去一期事畢寧不盡善盡美更教山僧說個什麼即得且山僧雖離此山恰恰二年朝夕與諸人眉毛廝結行則與諸人同行坐則與諸人同坐覓一糸毫隔礙底道理了不可得此日歸來依然只是舊時人不改舊時行履處所以道往復無際動靜一原去來不以象動靜不以心覓一糸毫動靜去來之相了不可得若信得及便好各各安家樂業張祖父田園吹無孔笛唱太平歌驅逐文殊普賢走使觀音勢至於一毫端見寶王剎坐微塵裏轉大法輪任運優游隨緣自在雖然如是若約衲僧分上要且未夢見他汗臭氣在豈不見江西馬大師昔日令西堂智藏馳書到當山大覺欽禪師大覺開緘見一圓相索筆於圓相中點一點可謂龍驤虎驟玉轉珠回好手手中呈好手紅心心裏中紅心因甚南陽忠國師却道欽師猶被馬師惑後來雪竇道徑山被惑且置若將呈似國師別作個什麼伎倆免被惑去敢謂天下老和尚各具金剛眼睛廣作神通變化還免得麼雪竇見處也要諸人共知即這馬師當時畫出早是惑了也耳道雪竇與麼批判還能自免也無山僧今日因齊慶讚舉似諸人以拂子打圓相云莫有不受惑者麼喝一喝復舉應菴和尚再住歸宗上堂舉南禪師出城還山有頌示衆云去日一溪流水送回時滿谷白雲迎一身去住非去住二物無情似有情應菴道南禪師好則好只是愛便宜歸宗亦有一頌舉似大衆去時冒雨連宵去回時帶水又拖泥自怪一生無定力尋常多被業風吹愚菴今日再住徑山亦有一頌舉似大衆去日應須償宿債回時宿債本來空山上鯉魚打𨁝跳一國之師展笑容上堂至道無難惟嫌揀擇如何是佛麻三斤如何是佛乾矢橛庭前柏樹子一夜風吹落上堂僧問牛頭未見四祖時如何師云深山藏毒虎進云見後如何師云淺草露群蛇進云見與未見時如何師云日出東方夜落西僧禮拜師乃云千波競起是文殊家風一亘晴空是普賢床榻春光淡蕩鳥語綿蠻萬壑爭妍千嵓並秀且道是什麼人境界直下會得更須知有人境俱奪向上一路拈拄杖有時卓向千峯頂劃斷飛雲不放高上堂無漏真淨云何是中更容他物良久啼得血流無用處不如緘口過殘春上堂僧問三世諸佛不知有狸奴白牯却知有未審知有個甚麼師云師姑元是女人做進云一大藏教是個切腳還親切也無師云切僧禮拜師乃云今朝五月一天晴日頭出林間梅子紅砌下泉聲急眼裏耳裏絶瀟灑無上菩提從此得教中道若以色見我以音聲求我是人行邪道不能見如來惺惺直須惺惺歷歷直須歷歷拍禪床云莫待當來問彌勒上堂五月五日端午節潦倒徑山無法說大家喫盞葛蒲茶一般滋味休分別分別則任汝諸人且道畢竟是何滋味良久云人情若好喫水也肥因事上堂舉古德道忍忍三世如來從此盡饒饒萬禍千殃從此消點點無上菩提從此得慈受深和尚云會得此三種語了好個不快活漢師云老慈受錯下名言會得此三種語了好個沒量大人還委悉麼堯舜不彰民自化相逢何必動干戈上堂舉子湖忽一夜於僧堂前呌捉賊大衆皆驚有一僧從堂中出子湖擒住云捉得也捉得也僧云不是某甲湖云是即是你不肯承當師云子湖好與三十棒何也只解捉賊不解殺賊上堂僧問聲聞見性如夜見月菩薩見性如晝見日和尚見性時如何師云黃河九曲水出昆崙進云直指人心見性成佛還端的也無師云問取達磨大師僧擬議師云子過新羅乃舉黃檗問百丈從上相承底和尚如何指示於人丈據坐蘗云後代兒孫將何傳受丈云我將謂你是個漢便歸方丈師云百丈便歸方丈則且置且道從上相承底畢竟是個什麼驀拈拄杖卓一下云秋初夏末東去西去南天台北五臺走得遍還自知上堂今朝又是八月一萬壑千岩儼秋色牛帶寒鴉過別村善財何處尋彌勒上堂今朝八月十五看取月圓當戶分明無缺無餘只恐諸人蹉過不蹉過兩箇拳頭一箇大上堂舉白雲示衆云金蘂叢叢帶露新采來烹茗賞佳辰浮杯何必須宜酒但有清香自醉人開福道白雲老人大似巧媳婦做出無餺飥惜乎知味者少開福效顰亦有一偈重陽黃菊未成花落帽無勞憶孟嘉但得青山長在眼不妨流水去無涯師云白雲開福大似徐六檐板各見一邊徑山見處也要諸人共知時移節換是尋常過了重陽又一陽人事自生今日意黃花只作去年香一日新到僧參師問汝名甚麼僧云智通師云一切智通無障礙汝為甚麼頭頭葉著處處繫絆僧云某甲參方遇夏過夏逢冬過冬今日特來禮拜和尚並無繫絆師云汝因甚螣蛇纏足僧看腳下師云又道無繫絆便打師又問僧汝名甚麼僧云慧徹師云年多少僧云四十師云四十而不惑汝還徹也未僧云某甲特來求和尚指迷師云眉在眼上僧擬議師亦打衍書記赴普慶上堂僧問釋尊出世為一大事因緣今日書記出世和尚升座舉揚畢竟為個甚麼師云今古應無墜分明在目前進云與麼則古釋迦不先今彌勒不後師云一任卜度進云三聖道我逢人則出出則不為人興化道我逢人則不出出則便為人且道是同是別師云一對無孔鐵鎚進云真淨和尚道這兩個老古錐竊得臨濟些子活計各自分疆列界氣衝宇宙又且如何師云關西子沒頭腦進云龍門無宿客龜鶴自成仙師云又被風吹別調中乃云欲識佛性義當觀時節因緣豈不見馬祖問藥山子近日見處作麼生山云皮膚脫落盡唯有一真實祖云子之所得可謂協於心體布於四肢既然如是將三條篾束取肚皮隨處住山去山云某甲又是何人敢言住山祖云不然未有長行而不住未有常住而不行欲益無所益欲為無所為宜作舟航無久住此馬簸箕固是蝦為子屈然則時節既至其理自彰正與麼時且如何說個自彰底理驀拈拄杖召大衆云來日普慶山中看取斯道長老為一切人分明舉似卓拄杖喝一喝上堂舉安國問僧云得之於心伊蘭作栴檀之樹失之於旨甘露乃蒺藜之園我要個語具得失兩意僧竪起拳云不可喚作拳頭國云只為喚作拳頭雪竇云無繩自縛漢拳頭也不識師云得又得個什麼失又失個什麼直饒得失兩忘未免無繩自縛更說什麼一語兩意遂竪起拳云一拳拳倒黃鶴樓一踢踢翻鸚鵡洲有意氣時添意氣不風流處也風流上堂舉僧問六祖黃梅衣鉢什麼人得祖云會佛法人得僧云和尚還得麼祖云我不得僧云和尚因甚麼不得祖云我不會佛法大慧和尚拈云大衆還見祖師面目麼若也不見山僧為你指出乃云蕉芭蕉芭有葉無了忽然一陳秋風起恰似東京大相國寺三十六院東廊下壁角頭王和尚破袈裟畢竟如何皈堂喫茶師云妙喜恁麼提持正是錯認驢鞍橋作阿爺下頷誤他後代兒孫隨例喚鍾作甕諸人要見祖師面目麼描也描不成畫也畫不就葉落歸根來時無口上堂今朝十月初一門外寒風凜溧待歸暖處商量何似當陽拈出驀拈拄杖云火爐闊一尺古鏡闊一尺三世諸佛出不得六代祖師出不得天下老和尚出不得達磨忌拈香萬里西來九年面壁前無釋迦後無彌勒單單遺下履一隻等閒賣弄價重連城奇特商量分文不直一番拈起一番新千古令人轉相憶呈香云休相憶今朝十月初五日上堂僧問如何是佛法大意師云開口見膽僧禮拜師便下座上堂今朝十一月十四打鼓升堂賀冬至南山雲起北山雲張公喫酒李公醉若論佛法兩字謝三娘賣銀上堂異法有故異法出生異法無故異法滅盡不教仁者取一法如微塵大不教仁者捨一法如毫𩬊許諸人每日上來下去也只是被些子聲色惑亂身心不安若是聲色名字不是佛法又疑伊作麼喝一喝上堂心是根法是塵兩種猶如鏡上痕痕垢盡時光始見心法雙忘性即真永嘉大師雖負曹溪正傳若到徑山門下直須棒了連夜趕出何故諸方聞得將謂徑山與人說心說性臘八上堂曠大劫來成正覺無端錯認定盤星徑山不是揚家醜只恐諸人昧己靈上堂舉白雲端和尚示衆云此事如萬仞崖頭總知道放著手腳便一朴到底只是捨命不得山僧不動毫頭教諸人到底去乃擲下拄杖師驀拈拄杖擲下召大衆云還得到底麼登山須到頂入海須到底登山不到頂不知太虗之寬廣入海不到底不知滄溟之淺深喝才有是非紛然失心上堂元正啓祚萬物咸新井底蓬塵蔽日山上鯉魚拏雲且不涉時緣一句作麼生道拈拄杖云拄杖今朝添一歲拈來依舊黑𥻘皴上堂十五日已前春雨如膏十五日已後春光似箭正當十五日管弦沸月宣和氣燈火燒空奪夜寒拈燈籠來佛殿裏將山門安燈籠上一切智智清淨無二無二分無別無斷故驀拈拄杖云三歲孩兒抱花鼓莫來攔我毬門路上堂一切無涅槃無有涅槃佛無有佛涅槃遠離覺所覺覺所覺空空所空滅寂滅見前眼中添屑既是寂滅見前為甚麼却眼中添屑咄咄咄無物堪比倫教我如何說上堂僧問既是一真法界為甚麼却有萬別千差師云甜瓜徹蒂甜苦瓠連根苦進云祖師道即心即佛又道非心非佛學人如何趣向師云擬向即乖乃舉圓悟與佛燈過溪次驀將佛燈推向水中便問牛頭未見四祖時如何燈云潭深魚聚又問見後如何燈云樹高招風又問見與未見時如何燈云伸腳只在縮腳裏師云同行須好伴還他佛燈圓悟雖然山僧當時若見總推向死水裏浸却何故老老大大過溪也不依本分上堂舉僧問虎丘隆禪師九旬禁足意旨如何隆云理長則就師云九夏安居就理長徑山無法可論量桑疇雨過羅紈膩麥隴風來餅餌香上堂舉金峯和尚示衆云山僧二十年前有老婆心二十年後無老婆心有僧便問如何是二十年前有老婆心峯云問凡答凡問聖答聖如何是二十年後無老婆心峯云問凡不答凡問聖不答聖師云路遙知馬力歲久見人心還見金峯立地處麼截斷生死根株超出聖凡途轍萬古乾坤一朝風月顏藏主赴千頃上堂舉古德道者一片田地分付來多時也我立地待你搆去法眼道者一片田地分付來多時也我坐地待你搆去佛果道這一片田地分付來多時也我今為汝當面慶懺一即三三即一所見不同互有得失徑山道這一片田地分付來多時也自是你搆不著今日分付用愚長老赤手提持袒肩擔荷向千頃雲中放兩拋三深耕淺種栽荊棘林開三毒花結無明果改禾莖為粟柄變瓦礫作黃金直得釋迦彌勒拍手喜歡文殊普賢合掌贊歎追還百代典刑振起一方叢席卓拄杖要識真金火裏看棒頭有眼明如日上堂舉翠岩示衆云一夏與兄弟東語西話看翠岩眉毛在麼用盡自己心笑破它人口保福云作賊人心虗是精識精是賊識賊長慶云關一字入公門九牛拽不出這一隊漢朝打三千暮打八百有什麼罪過只如洞山道秋初夏末東去西去直須向萬里無寸草處去石霜云出門便是草諸人作麼商量若也不會徑山直為頌出萬里無寸草出門便是草大盡三十日小盡二十九下座上堂諸方今日開爐未免與諸人說些火爐頭話以拂子作吹火勢云喚作火燒煞你不喚作火凍煞你上堂四大本空佛依何住青青翠竹盡是法身若悟無依佛亦無得黃花無非般若諸人信也好不信也好三千里外遇著本色道流輒不得道徑山從來柳下惠上堂僧問如何是不遷義師云日出東方夜落西進云如何是不壞身師云昨日生今日死進云如何領會師云不快漆桶乃舉五祖和尚云有一物不屬凡不屬聖不屬邪不屬正萬事臨時自然號令師云家無白澤之圖豈有如是妖怪上堂舉麻谷持錫到章敬繞禪床一匝振錫一下卓然而立敬云是是又持錫到南泉繞禪床一匝振錫一下卓然而立泉云不是不是谷云章敬道是和尚為甚麼道不是泉云章敬是是汝不是此是風力所轉終成敗壞師云百鳥不來春又過不知誰是到菴人上堂冬至前後砂飛石走草木叢林作師子吼羣陰剝盡一氣潛回一亦莫守萬法無咎驀拈拄杖云拄杖子吞却山河大地置而不問且道馬大師自從胡亂後因甚三十年不少鹽醬卓拄杖金輪天子勑草店家風別上堂迦葉糞掃衣價直百千萬輪王髻中寶不直半分文常州草蟲一百文買一幅蘇州城裏泥孩兒三文錢買一對有利無利不離行市猫兒偏解捉老鼠上堂僧問達磨未來時如何師云眼在鼻上進云來後如何師云腳在肚下問如何是學人自己師云腳板大如手掌進云如何是衲僧行腳事師云緊峭草鞋乃舉雲門問踈山如何是法身邊事山云枯樁又問如何是法身向上事山云非枯樁門云還許學人說道理也無山云許門云枯樁豈不是明法身邊事山云是門云非枯樁豈不是明法身向上事山云是門云法身還該一切否山云爭得不該門指淨瓶云法身還該者個麼山云闍梨莫向淨瓶邊會門便禮拜師云二員尊宿一問一答一挨一拶如珠走盤縱橫無礙可謂善說法要雖然要且只說得法身邊事諸人要會法身向上事切忌向語脉裏轉却何也一兔橫身當古路蒼鷹才見便生擒後來獵犬無靈性空向枯樁舊處尋上堂今朝五月端午節徑山為汝開真訣赤口白舌盡消除百怪千妖俱殄滅黃鸝上樹一枝華白鷺下田千點雪參玄流善甄別觀音菩薩將錢買糊餅放下手却是一塊生鐵擊拂子下座上堂生佛已前有一段奇特因緣大家會取好便下座上堂僧問德山入門便棒時如何師云寰中天子勑進云臨濟入門便喝時如何師云塞外將軍令進云一人行棒一人行喝總道是發大機顯大用還有優劣也無師云今日熱如昨日僧云謝師答話師乃云今朝六月初一諸處栽田已畢炎炎火日當空大野流金鑠石衲僧搖扇取涼不費纖豪氣力不費力萬兩黃金亦消得青苗上堂僧問藥山尋常不許人看經意旨如何師云常轉如是經百千萬億卷進云山一日看經次有問和尚不許人看經因甚却自看山云我只要遮眼又且如何師云汝若看牛皮也須穿進云和尚今日普請看經畢竟功皈何所師云汙邪滿車甌窶滿篝乃舉教中道如來所演八萬四千法藏言教皆名為文離一切言音文字理不可說是名為義又云若諸經中文句廣博能令衆生心意踴躍名不了義若能宣說文句及心皆同灰燼是名了義山中今日滿散青苗勝會見前大衆一七日中披宣大藏依了義經不依不了義經一句一偈一字一義莫不格於天地感於神明悉使見聞心意踴躍且如何說個文句及心皆同灰燼底道理雲門大師道直得觸目無滯達得名身句身山河大地是名名亦不可得喚作三昧性海俱備猶是無風匝匝之波直得忘知於覺覺即佛性喚作無事人更須知有向上一竅在且作麼生是向上一竅拈拄杖汙邪滿車甌窶滿篝因監寺入塔因妄有生因生有滅寂滅見前髑髏眼活菡萏花開栗棘蓬無縫塔中雲匌匝上堂舉保寧勇和尚示衆云祖師門下絶人行深險過於萬仞坑垂手不能空費力任教堂上緑苔生師云見義不為何勇之有寂照忌拈香巴陵酬雲門之恩只憑三轉語儉生不孝楊岐為慈明設齊特作女人拜義出豐年徑山今日先師忌辰直是無可施設茗碗熏爐聊伸供養庶表不忘諸人且道不忘個什麼便燒香善權通長老嗣書至上堂自從胡亂後三十年不少鹽醬雪後始知松柏操任汝非心非佛我只管即心即佛事難方見丈夫心有底便道江西信息通也大梅梅子熟也善權方便固當如是只如石頭道書亦不達信亦不通諸人如何話會直下道得鈯斧子未到你在圓悟大慧祖師同忌拈香隻手不獨拍單絲不成線兩個五百文鬬湊合一貫雞啼白晝認頻呼小玉總墮聲塵薰風南來證諸佛法身何曾夢見橫說竪說熾然說卷百億香水海於廣長舌本波瀾內空外空畢竟空攝有漏微塵國于事事無礙法界臭皮襪炙地熏天折竹篦鍧雷掣電擉瞎臨濟正法眼摵碎東山鐵餕餡陵滅宗風五逆孫終不隨他腳跟轉香爇一爐茶傾三奠盞子撲落地碟子成七片上堂一二三四五六七地水火風空覺識拈來數目甚分明明眼衲僧數不出數得出也大奇烏龜鑽敗壁雞向五更啼十月旦上堂當爐不避火迸當言不避截舌騎驢入爾鼻孔裏牽牛入爾眼睛中作麼生商量若道不得老僧代諸人下一轉語擲拄杖下座一提點入塔一人發真皈元十方虗空消殞寶塔從地湧出正是平地骨堆撫骨云無人知此意令我憶楊岐元宵請藏主典座上堂佛法無人說雖慧莫能了譬如暗中寶無燈不能見僧問睦州一氣還轉得一大藏教也無州云有甚饆饠䭔子快下將來是你諸人作麼生了作麼生見驀拈拄杖百般制造由人到底無過是麵卓拄杖喝一喝上堂離言說相離文字相離心緣相畢竟如何迦葉擎拳阿難合掌上堂僧問不是心不是佛不是物是個甚麼師云天人羣生類皆承此恩力進云謝和尚指示師云莫謗老僧好僧禮拜師乃拈拄杖云三世諸佛亦如是西天二十八祖亦如是東土六祖亦如是天下老和尚亦如是左邊卓云如是則易不如是則難右邊卓云如是則難不如是則易中間卓云也不難也不易靠拄杖放在臥床頭急要打老鼠請兩序上堂獨樹不成林兩手鳴摑摑老大小叢林各要知時節主事輔弼山門頭首贊揚佛法十方高人聚會究取當頭一著長老坐致太平手裏把個木杓驀拈拄杖諸人從朝至莫啾啾唧唧說黃道黑總在杓頭裏七出八沒且道杓柄長多少卓拄杖喝一喝上堂葵花隨日轉芭蕉聞雷抽菩提煩惱循業發見劃拄杖分開碧落松千尺截斷紅塵水一溪行重建行春橋師召衆云大橋雄跨石湖濵捨舊圖新喜落成萬國車書通遠道三吳城郭展修程溪山出色增佳勝簫鼓行春樂太平不動腳頭登彼岸十方一路要分明好諸仁者還他力量人辨此奇特事功夫妙密機用縱橫易深險成坦途架虗空為平地高高處觀之不足低低處仰之有餘可以津濟四生可以梯航九有直得輝騰佛日慶衍皇圖牧謳樵唱共履康莊馬載驢駝咸臻實際正與麼時且平步丹霄高超物表一句作麼生道遂驟步云塵塵剎剎無留礙直踏毗盧頂上行
