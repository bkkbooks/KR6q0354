body:
  text: 杭州路淨慈報恩禪寺語録門人正除等編師於至正戊戌七月二十日承行宣政院領院官太尉丞相達識帖穆爾差宣使九曜奴馳驛於蘇州受業海雲院敦請入寺據室云刮龜毛於鐵牛背上朝打三千截兔角於石女腰邊莫打八百指東劃西鼓唇搖舌耳居門外擊石火閃電光冰稜上度過九𨸰劒刃上拾得全身苕帚柄聊與三十總不與麼來時如何拈拄杖吽吽指法座云盡十方世界是普光明藏師子之座諸佛衆生同起同坐因甚山僧今日特地高升只恐諸人昧其所自便升座斂衣就坐上竺和尚白椎云法筵龍象衆當觀第一義師云若論第一義法筵未啓法鼓未鳴山僧未升座已前薦得早落第二了也設使起模畫樣作意商量問一句來答一句去未免落七落八今日衆中莫有天然氣槩底麼不妨相見僧問保壽開堂三聖推出一僧壽便打意旨如何師云蚊子上鐵牛進云三聖道恁麼為人非但瞎却這僧眼瞎却鎮州一城人眼去在壽便歸方丈又作麼生師云子過新羅進云只如和尚今日開堂相君堅請湖海交歡四衆臨筵如何指示師云但把片心窮浩劫蕩雲深處祝堯年僧禮拜師乃云皇皇南宕勝覺場奕奕永明高廣座山僧才踈德薄豈敢躋板然遇緣即宗難為辭讓湖光瀲灩山色空濛廓示真如境界宗鏡高懸慧日朗耀張少室風規一一騰今煥古頭頭玉轉珠回真得釋迦彌勒共樂堯年文殊普賢同傾舜日雖然如是猶未撥動向上一竅在喝干戈才偃息四海樂升平復舉當山智覺禪師示衆云欲識永明旨門前一湖水日照光明生風吹波浪起師云諸人還見祖師麼卓拄杖要識是非面目見在開堂閲藏經上堂終日看經經頭一字因甚不識長年喫飯千粒萬粒從一粒生因甚不知卓拄杖云打破兩重關泗洲人見大聖上堂天不能蓋地不能載細入無間大絶方所黃連甜甘草苦焦螟蟲吞却虎明眼衲僧休莾鹵謝齋秉拂上堂舉五祖和尚示衆云結夏無可管顧諸人未免作一家宴遂擡手云邏囉招邏囉搖邏囉送莫怪空踈伏惟珍重南屏冬至叢席荒涼直是無可施設賴有庫司都寺與堂中首座前日作那一場佛事不同小小離四句絶百非攪酥酪醍醐為一味鎔瓶盤敘釧為一金令我現前一衆三世諸佛歷代祖師五百十六大阿羅漢均飽禪悅法喜眼裏也飽耳裏也飽不覺手之舞之足之蹈之歡喜踴躍向宗鏡光中同聲贊歎云希有希有奇哉奇哉於食等者於法亦等於法等者於食亦等山僧只管端坐受供養且道與五祖相去多少良久云其施汝者不名福田供養汝者墮三惡道上堂僧問蓮花未出水時如何師云寒則普天普地寒進云出水後如何師云熱則普天普地熱進云如何是佛法大意師云門前一湖水乃云一九二九相喚不出手三九二十七樹頭吹觱栗四九三十六夜眠如露宿時節不相饒朱顏日漸凋你衲僧家寒則向火熱則乘風各自照鏡看面皮厚多少上堂舉僧問鏡清新年頭還有佛法也無清云有僧云如何是新年頭佛法清云元正啓祚萬物咸新僧云謝師答話清云鏡清今日失利又僧問智門新年頭還有佛法也無門云無僧云年年是好年日日是好日為什麼却無門云張公喫酒李公醉僧云老老大大龍頭蛇尾門云智門今日失利師云新年頭有佛法鏡清合喫二十拄杖新年頭無佛法智門合喫二十拄杖何故老老大大不合説有説無喝道無不是無道有不是有東望西耶尼面南看北斗元宵上堂人人自有光明在看時不見暗昏昏既是自己光明因甚看時不見驀拈拄杖敲燭臺云一燈發千光千光一燈見佛涅槃上堂湖光瀲灩晴偏好山色空濛雨亦奇淨法界身無出沒不須惆悵怨芳時清殿主火琉璃殿上荊棘參天勝熱門頭清風匝地擲火云郎當屋舍沒人修火官頭上風車子佛誕上堂僧問淨法界身本無出沒因甚釋迦老子今日降生師云知而故犯進云遵布衲浴佛次藥山問你只浴得這個還浴得那個麼遵云把將那個來如何是那個師云擔枷過狀又僧問心佛及衆生是三無差別還端的也無師云的進云不是心不是佛不是物是個甚麼師云不識又僧問佛身無為不墮諸數因甚有千百億化身師竪拂子云你道這個是第幾身僧擬進語師便喝僧退後師云身口意清淨是名佛出世身口意不淨是名佛滅度三文錢娶個黑老婆頭不梳面不洗知他是凡是聖一日供羅漢達識帖穆爾丞相到寺問師云長老今日供羅漢五百尊者俱來應供也無師云活佛降臨羅漢安得不至相云施主設齋得何果報師云種穀不生豆相云恁麼則功不浪施也師云賴遇丞相證明相云三輪空寂畢竟如何師云空相云功歸何所師不答相云長老何不轉語師云且請方丈喫茶丞相到方丈又問淨名丈室容受三萬二千師子座淨慈丈室容多少師云一塵不立相云得與麼覿體相違師揭起簾云請丞相鑑相呵呵大笑云作家宗師不勞再勘師便供茶上堂教中道見見之時見非是見見猶離見見不能及顧左右召大衆云還見麼一等共行山下路眼頭各自看風煙上堂僧問古人拈椎竪拂意旨如何師竪起拂子進云畢竟意作麼生師云待汝一口吸盡西湖水只向汝道乃云譬如琴瑟箜篌琵琶雖有妙音若無妙指終不能發橫按拄杖以手作撫琴勢云發則發了也諸人還聞麼佛以一音演説法衆生隨類各得解不見祖師道幽幽寒角發孤城十里山頭漸杳冥一種是聲無限意有堪聽有不堪聽上堂古德道一處不通兩處失功兩處不通觸途成滯雲門舉了拈起拄杖云山河大地三世諸佛盡在拄杖頭上有甚滯礙一切衆生只被色空明暗隔礙便見有生滅之法師拈起拄杖云拄杖子吞却山河大地色空明暗何處有也生滅之法了不可得諸人每日著衣喫飯行住坐臥有甚麼滯有甚麼礙上堂僧問真空不壞有真空不壞色作麼生是真空師云山河大地進云治生産業皆與實相不相違背如何是實相師云無明煩惱進云便恁麼去時如何師云笑破虗空乃云撥草瞻風只圖見性即今上人性在甚處識得自性方脫生死眼光落地時作麼生脫脫得生死便知去處四大分離向什麼處去大衆不得孤負兜率不得孤負老僧不得孤負自己上堂何物苦求而不得何物不求而自來何物鐵椎打不破何物夜合而晝開滿地落花春已過緑陰空鎖舊莓苔祖忌拈香雙耳帶金環兩眼如墨突行腳不逢人九年空面壁破邪師六宗異見亂世英雄傳上乘一心之印太平姦賊隻履翩翩何處歸一花五葉成狼籍顧左右云淨智妙圓體自空寂嗣隆藏主火宗風欲嗣虎丘隆藏教掀翻氣吐虹二十七年全體現南山燒炭北山紅千秋節冬至上堂千秋令節今朝是九九陽生第一爻四海陰霾俱解駮宕雲深處祝唐堯平山林和尚入祖堂召大衆云亭亭石塔東峯上此老初來百神仰福源浩浩起當湖千歲岩頭飛白浪宗鏡高懸二十年不啻焰光高萬丈翻身靠倒靈鷲峰雙樹悲風撼穹壤撲碎破砂盆滅却正法眼動靜絶行蹤去來無影象是謂眼空佛祖道重王臣年逾八秩五處住山平山老和尚指牌云湖光瀲灩山空濛覿體全彰大人相上堂僧問元正啓祚萬物咸新如何是新年頭佛法師云日日香花夜夜燈進云蒲團靜倚無餘事永日寥寥謝太平師云知恩方解報恩乃云元正啓祚須彌椎打虗空鼓萬物咸新普天和氣轉洪鈞恭惟首座大衆藍田美玉丹山鳳各各起居多福永日寥寥謝太平一湖春水當門淥江浙省丞相達識帖穆爾修設水陸普度大會升座拈香云此香育乾坤之正氣真柱國之長材擢幹舒光匝祥芬於龍樓鳳閣分枝布葉騰瑞藹於柏府薇垣拈來價重連城爇處恩覃沙界奉為某人虔爇寶爐供養十方常住三寶法界幽顯聖凡平等資熏普皆饒益出生功德祝延今上皇帝聖躬萬歲萬歲萬萬歲陛下欽願政教立而姦邪止八方銷兵革之憂陰陽調而風雨時萬姓樂耕桑之業遂就坐僧問大丞相揮金建會普濟群生名尊宿據令提綱願聞極唱師云且喜天下太平進云與麼則八方銷兵革之憂萬姓樂耕桑之業師云重言不當吃進云教中道釋迦世尊以一大事因緣故出現於世欲令衆生開示悟入佛之知見莫不便是者個道理麼師云休將鶴唳誤作鶯啼進云大丞相方面東南翊贊中外廣修勝會保國安民所獲福德其量幾何師云虗空可量風可繫無能盡説佛功德僧禮拜師乃云釋迦世尊以一大事因緣故出現於世種種譬喻演説諸法欲令衆生開示悟入佛之知見所以道我此法印為欲利益世間故説唯此一事實餘二則非真有道是法非思量分別之所能解在所遊方勿妄宣傳敢問諸人且如何説個一大事因緣竪拂子云離却拂子道得則大丞相修設水陸普度勝會一期事畢山僧不必高升此座鼓兩片皮諸人不妨各自散去其或未然向第二義門與諸人打葛藤去也良久云譬如虗空具含衆象於諸境界無所分別又如虗空普遍一切於諸境界平等隨入如天普蓋如地普擎如日普照如風普吹不可以智知不可以識識諸佛出世以之成等正覺津濟四生梯航九有祖師西來以之建法幢立宗旨開甘露門廣度群品當今聖主以之統御金輪調和玉燭九重端拱無為萬國咸歸至化故我大丞相以之方面東南股肱王室拯生民於水火保社稷於安危展皋夔稷卨之訐謨樹伊傅召周之大業見前勝流以之治生産業作諸佛事乃至今辰結集勝會同音僉誦法華妙典説戒放生熏修懺法悉使見聞莫不回三毒為三聚淨戒轉六識為六波羅蜜回煩惱為菩提轉無明為大智以之保國安民則國安民泰以之禳災弭盜則盜息災消以之懺罪則罪垢蠲除以之薦亡則亡沒解脫以之普度水陸會內幽顯聖凡則同駕願輪俱登覺岸可謂理無不遍事無不周殊勝中殊勝奇特中奇特如寶月之行空了無朕迹如蓮花之出水不染淤泥喝便以此為一大事因緣切忌錯認驢鞍橋作阿爺下頷要耳未摸著他釋迦老子腳根下一莖毛在直饒離言説相離文字相離心緣相大似癡狂外邊走亦未夢見他釋迦老子腋下汗臭氣在擊石火閃電光淨倮倮赤灑灑沒可把也是蝦蟇窟裏作活計畢竟如何驀拈拄杖釋迦老子穿過諸人鼻孔卓一下云拄杖吞却釋迦老子又卓云釋迦老子吞却拄杖舉起云喚作拄杖又是釋迦老子喚作釋迦老子又是拄杖擲下云拄杖不可得釋迦老子不可得諸人鼻孔在什麼處且喚什麼作大事因緣一切智智清淨無二無二分無別無斷故遂合掌顧左右云看看十字街頭石敢當醉中驚覺起來倒騎拱北樓奮身虗空歡喜踴躍普告大衆云日暖風和二月天同修勝會結良緣黎民永息三災劫聖壽延鴻億萬年喝一喝復舉天台智者大師昔居南嶽讀法華經至是真精進是名真法供養如來見一會靈山儼然未散敢問大衆智者自是陳隋時人與釋迦老子相去二千餘載因甚却見一會靈山儼然未散為復是神通妙用法爾如然這裏緇素得出便見大丞相即今與智者大師釋迦老子把手並行不異靈山一會其或未然是真精進是名真法供養如來更須仔細熟讀始得拍禪床下座上堂顧視大衆云會麼山門前金剛是泥做便下座上堂林泉涼夏日長頭頭顯露物物昭彰雨過六橋楊柳暗風來十里芰荷香上堂今朝五月半舉則舊公桉普請諸禪流大家著眼看驀拈拄杖喚作南屏拄杖笑倒五百羅漢乘提點火十方國土中唯有一乘法劫火洞然世界俱壞唯金剛圈不壞莫不便是這箇法麼舉火把云道得也是火焰上添草七月旦請侍者諸山客至上堂一葉落天下秋法身須透閙啾啾定光金地遙招手智者江陵暗點頭驀喚侍者云三界唯心萬法唯識一句中具三玄一玄中具三要且道與上來説話相去多少良久若也不會問取諸山和尚上堂僧問如何是本身盧舍那師云不離闍梨所問進云如何保任師云彼自無瘡勿傷之也乃舉僧問安國師如何是本身盧舍那國師云為老僧過淨瓶來僧取淨瓶與師師云却安舊處著僧安舊處又問如何是本身盧舍那國師云古佛過去久矣雲門云無眹迹師云雲門好個無眹迹畢竟如何是本身盧舍那乃云花發雞冠媚早秋誰人能染紫絲頭有時風動頻相倚似向階前鬪不休喝一喝上堂十方諸佛是個爛木橛三賢十聖是個茅溷頭籌子汝等諸人總來者裏作麼琅瑘與麼告報可謂恩大難酬諸人若也未知報恩更為頌出十方諸佛爛木橛十聖三賢茅溷籌無事晚來湖上望白蘋紅蓼滿汀洲寂照忌拈香今朝八月初四日一句明明道不得合國人追不再來千古萬古空相憶徑塢雲深西湖水碧爇蒼松古柏作栴檀牛首之香擷蘊藻蘋蘩為酥酪醍醐之食聊旌遠諱斯臨倍覺感懷疇昔非關義重恩深只貴眼橫鼻直一度秋風一度愁地久天長有何極請昌國吉祥亨子元充首座上堂臨濟建立黃檗宗旨普化盡力成褫無端仰山道此人有頭無尾有始無終山僧昔年承乏海山子元橫身輔佐茲者備員宕寺又荷分座説法却不似仰山道此人有頭無尾有始無終也諦觀佛祖各各出興隨方化導莫不全賓全主全主全賓大用齊彰大機普應流通正法眼藏顯示涅槃妙心直得雲行雨施水到渠成還他過量人堪任過量事卓拄杖龍得水時添意氣虎逢山色長威獰開爐上堂火爐頭話無賓主無主無賓話亦無潦倒丹霞燒木佛却教院主墮眉須赴徑山退院上堂備員南宕恰三年又向淩霄闡化權了却先師舊公案飢來喫飯困來眠且先師公案作麼生了拍禪床下座
